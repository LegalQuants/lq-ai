# Prompt-injection detection-rate harness (DE-239). Weekly + manual dispatch.
#
# Seeds an in-repo attack corpus (tests/injection/corpus/) into DE-231's
# synthetic acceptance fixtures and sends each through the NORMAL api
# chat-send path against a freshly booted compose stack — real inference
# through the gateway, which needs a provider key configured as a
# repository secret (ANTHROPIC_API_KEY or OPENAI_API_KEY). Scoring is
# deterministic (canary token + structural checks); there is NO LLM judge.
#
# Honesty invariant: when no provider-key secret is configured, the job
# SUCCEEDS with a prominent "skipped: no keys configured" summary — it
# never pretends the rates ran. The keyless half of DE-239 (corpus format
# + composer/scorer determinism, tests/injection/test_injection_inventory.py)
# runs in the regular per-PR pytest path, not here.
#
# Weekly (not nightly): a full run is 44 attacks x real inference plus a
# cold compose build, and observable behavior can drift with model changes. Rates land
# as an uploaded artifact (summary.json); publish only complete/publishable runs into
# docs/quality/prompt-injection-rates.md is a documented maintainer step,
# not an automatic commit. A ratcheted regression gate activates only once
# a maintainer commits tests/injection/detection-floor.json.
#
# Cost note: one full run = 44 attacks x 1 model alias of real inference
# plus a cold compose build (~25-35 min). That is why this is
# weekly/dispatch-only and never per-PR.

name: Injection rates

on:
  schedule:
    # Weekly, Monday 05:07 UTC — offset from the nightly golden + mutation
    # runs to avoid stacking scheduled jobs.
    - cron: "7 5 * * 1"
  workflow_dispatch:

concurrency:
  group: injection-rates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  injection:
    name: Measure injection observations against the compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Require a trusted default-branch run
        env:
          RUN_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RUN_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Live evaluation credentials may only be used on the default branch"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check provider-key secrets
        # Secrets are not readable in `if:` expressions, so expose them to
        # this one step and publish a boolean output. When absent, the job
        # ends green with an explicit skip notice — never a silent or fake
        # pass.
        id: guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY}" ] || [ -n "${OPENAI_API_KEY}" ]; then
            echo "have_keys=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_keys=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Injection rates: SKIPPED — no provider keys configured"
              echo
              echo "Neither \`ANTHROPIC_API_KEY\` nor \`OPENAI_API_KEY\` is set as a"
              echo "repository secret, so the live injection tests **did not run**."
              echo "This job succeeding does NOT mean injection behavior was measured."
              echo "Configure a provider-key secret to enable the weekly measurement."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "injection-rates: skipped — no provider keys configured"
          fi

      - name: Free runner disk space
        if: steps.guard.outputs.have_keys == 'true'
        # Same reclaim as stack-smoke.yml: the api image family needs far
        # more space than the default runner offers.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/lib/jvm /usr/share/swift \
            /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules
          sudo docker image prune -af
          df -h /

      - name: Set up Python
        if: steps.guard.outputs.have_keys == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        if: steps.guard.outputs.have_keys == 'true'
        # The harness is deliberately lightweight: pytest + httpx + pyyaml,
        # no api/gateway package install needed.
        run: |
          pip install --require-hashes --only-binary=:all: -r tests/eval-requirements.txt

      - name: Write .env with provider keys
        if: steps.guard.outputs.have_keys == 'true'
        # stack-smoke.sh writes a dummy .env only when none exists;
        # pre-writing one here injects the real provider keys the gateway
        # needs for inference. Non-key secrets are run-scoped throwaways
        # (the stack is destroyed with the runner).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          umask 077
          JWT_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$JWT_SECRET"
          cat > .env <<EOF
          POSTGRES_PASSWORD=ci-injection-postgres
          MINIO_ROOT_PASSWORD=ci-injection-minio-password
          LQ_AI_GATEWAY_KEY=ci-injection-gateway-key
          JWT_SECRET=${JWT_SECRET}
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          EOF

      - name: Build and boot the compose stack
        if: steps.guard.outputs.have_keys == 'true'
        # Reuses the battle-tested stack-smoke boot path (build order,
        # image tagging, healthcheck wait, diagnostics on failure). The
        # soak is shortened — this job's signal is the injection run, not
        # boot stability.
        run: |
          set -o pipefail
          SOAK_SECONDS=5 ./scripts/stack-smoke.sh 2>&1 \
            | sed -E 's/(First-run admin password[^:]*:).*/\1 [REDACTED]/'

      - name: Bootstrap api credentials
        if: steps.guard.outputs.have_keys == 'true'
        id: bootstrap
        run: bash scripts/bootstrap-eval-user.sh

      - name: Run the injection harness
        if: steps.guard.outputs.have_keys == 'true'
        env:
          LQ_INJECTION_LIVE: "1"
          LQ_EVAL_GATEWAY_READY: "1"
          LQ_INJECTION_PASSWORD: ${{ steps.bootstrap.outputs.password }}
          LQ_INJECTION_REPORT_DIR: injection-report
        run: pytest tests/injection -m injection_live -q

      - name: Remove disposable stack and credentials
        if: always() && steps.guard.outputs.have_keys == 'true'
        run: |
          status=0
          docker compose down --volumes --remove-orphans || status=$?
          rm -f .env
          rm -rf stack-smoke-logs
          exit "$status"

      - name: Summarize rates
        if: always() && steps.guard.outputs.have_keys == 'true'
        run: |
          if [ -f injection-report/summary.json ]; then
            {
              echo "## Injection observations (overall)"
              jq -r '.run | "- complete: \(.complete)\n- publishable: \(.publishable)\n- expected/completed: \(.expected)/\(.completed)"' injection-report/summary.json
              jq -r '.floor | "- floor status: \(.status)"' injection-report/summary.json
              echo "Publish only when complete and publishable are both true."
              echo
              jq -r '.overall.rates |
                "- total attacks: \(.total)\n- canary absence rate: \(.canary_absence_rate)\n- task-preservation proxy: \(.task_preservation_proxy_rate)\n- structural failure rate: \(.structural_failure_rate)"' \
                injection-report/summary.json
              echo
              echo "Per-cell rates and raw outputs are in the \`injection-reports\` artifact."
              echo "Publishing these into docs/quality/prompt-injection-rates.md is a"
              echo "documented maintainer step (see that doc)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always() && steps.guard.outputs.have_keys == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: injection-reports
          path: injection-report/
          if-no-files-found: ignore
          retention-days: 30
