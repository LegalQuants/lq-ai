name: Desktop launcher (macOS)

# Builds, signs, and notarizes the "LQ.AI for Mac" launcher .dmg and publishes it
# to a GitHub Release. Separate pipeline from release.yml (which publishes the
# container images): this one runs on macOS and needs the Apple signing secrets.
#
# Triggered by a `desktop-v*` tag push (e.g. desktop-v0.4.0) or manual dispatch.
# Keep the image release (`v*`) and the desktop release (`desktop-v*`) as distinct
# tags so they can be cut independently.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag for the .dmg (e.g. desktop-v0.4.0)'
        required: true
      diagnostics:
        description: 'Expose notarization errors without publishing a release'
        type: boolean
        default: false
  push:
    tags: ['desktop-v*']

# Least privilege: only enough to publish the .dmg asset to a Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - name: Unit tests (pure core)
        run: npx vitest run
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Expose the underlying Apple notarization error
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const builder = path.dirname(require.resolve('app-builder-lib/package.json'));
          const file = require.resolve('@electron/notarize/lib/notarytool', { paths: [builder] });
          const source = fs.readFileSync(file, 'utf8');
          const needle = 'const parsed = JSON.parse(result.output.trim());';
          if (source.split(needle).length !== 2) {
            throw new Error('Unexpected notarization dependency source; diagnostic patch not applied');
          }
          const replacement = `let parsed;
          try {
            parsed = JSON.parse(result.output.trim());
          } catch {
            let detail = result.output.trim();
            for (const key of ['APPLE_ID', 'APPLE_APP_SPECIFIC_PASSWORD', 'APPLE_TEAM_ID', 'CSC_LINK', 'CSC_KEY_PASSWORD']) {
              const secret = process.env[key];
              if (secret) detail = detail.split(secret).join('[redacted]');
            }
            throw new Error('Apple notarytool exited with code ' + result.code + '\\n' + detail);
          }`;
          fs.writeFileSync(file, source.replace(needle, replacement));
          console.log('Notarization error diagnostics enabled');
          JS
      - name: Resolve the image tag pinned into this launcher
        id: image-tag
        env:
          DESKTOP_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$DESKTOP_TAG" in
            desktop-v*) echo "value=${DESKTOP_TAG#desktop-}" >> "$GITHUB_OUTPUT" ;;
            *) echo "Expected a desktop-vX.Y.Z tag, got: $DESKTOP_TAG" >&2; exit 1 ;;
          esac
      # `npm run dist` runs prepack:compose first, which copies the repo-root
      # docker-compose.release.yml into desktop/resources/ before electron-builder
      # bundles it as an extraResource. The working-directory is `desktop`, so the
      # script's relative `../docker-compose.release.yml` resolves to the repo root.
      - name: Build, sign, notarize .dmg
        env:
          # electron-builder reads CSC_LINK / CSC_KEY_PASSWORD for the Developer ID
          # signing identity (stored base64-encoded in MAC_CSC_LINK).
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # notarytool (native notarize + build/notarize-dmg.cjs for the dmg) reads
          # these from the env. teamId is ALSO hardcoded in electron-builder.yml
          # (Part C Trap 1 — electron-builder does not read APPLE_TEAM_ID from env
          # for the native .app notarize step).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          LQ_AI_RELEASE_IMAGE_TAG: ${{ steps.image-tag.outputs.value }}
        run: |
          if [[ "${{ inputs.diagnostics }}" == "true" ]]; then
            npm run prepack:compose
            npm run build
            npx electron-builder --mac --publish never
          else
            npm run dist
          fi
      - name: Publish .dmg to the release
        if: ${{ !inputs.diagnostics }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: desktop/dist/*.dmg
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
