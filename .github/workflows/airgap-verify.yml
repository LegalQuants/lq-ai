# Air-gap install verification (roadmap 3.5 — DE-032 + DE-233).
#
# Proves, in CI, the claim no surveyed self-hosted project proves (see
# docs/security/air-gap-verification.md): the compose stack — in Mode 2
# (`--profile local`) — boots and serves a real login -> chat -> Tier-1
# response with ZERO packets leaving the deployment network.
#
# Mechanism (scripts/airgap/*.sh are the single source of truth and the
# local-reproduction path):
#   1. Everything network-needing happens FIRST: build images, pull the
#      digest-pinned third-party images, pre-fetch the Ollama model.
#   2. The compose bridge is then SEALED: an iptables DOCKER-USER chain
#      drops every forwarded packet from the bridge whose destination is
#      not RFC1918/loopback. iptables (not a compose `internal: true`
#      override) so the SHIPPED topology is what gets certified —
#      GitHub-hosted ubuntu runners allow sudo iptables, and DOCKER-USER
#      only affects container traffic, never the runner's own network.
#   3. A tcpdump canary on the bridge records any non-private-destination
#      packet — catching even ATTEMPTS the seal drops (telemetry an app
#      would silently tolerate as a connection error).
#   4. The full stack is booted UNDER the seal (fresh containers, so
#      first-boot paths — migrations, gateway config seeding, admin
#      bootstrap — all run offline), then a real user journey is driven
#      end to end and the gateway's routing log is asserted to show
#      provider=ollama-local / tier=1 only.
#   5. Negative control: a deliberate egress attempt from inside the
#      sealed gateway container must FAIL at the seal AND must appear in
#      a second capture — proving both the seal and the canary are live
#      (no vacuous pass from a mis-wired interface).
#
# Triggers: this job is heavy (~30-45 min: full cold image build + model
# pull + CPU inference), so it does NOT run on every PR. It runs on PRs
# that touch the files the proof depends on (compose topology, gateway
# config, the harness itself), weekly to catch drift that arrives via
# other files (dependency bumps introducing phone-home, image digest
# bumps), and on demand. Boot-level regressions on the broader path set
# are already covered by stack-smoke.yml on those paths.

name: Air-gap verify

on:
  pull_request:
    paths:
      - docker-compose.yml
      - gateway.yaml.example
      - scripts/airgap/**
      - .github/workflows/airgap-verify.yml
  schedule:
    # Weekly, Monday 04:17 UTC (odd minute to avoid the on-the-hour
    # scheduler pileup GitHub documents).
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: airgap-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Small CPU-viable model for the Tier-1 smoke. Routed via the
  # gateway's raw `ollama-local/<model>` passthrough so the SHIPPED
  # gateway.yaml.example is used unmodified — see the rationale in
  # scripts/airgap/drive-smoke.sh.
  AIRGAP_MODEL: llama3.2:1b

jobs:
  airgap-verify:
    name: Sealed-network install + Tier-1 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Free runner disk space
        # Same reclamation as stack-smoke.yml: the api-family image
        # unpacks to ~12 GB (docling pulls CUDA-enabled torch) and the
        # BuildKit cache costs about as much again; this run adds the
        # Ollama image + model blobs on top.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/lib/jvm /usr/share/swift \
            /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules
          sudo docker image prune -af
          df -h /

      - name: Write boot-only .env
        # Same dummy secrets as scripts/stack-smoke.sh — no provider
        # keys, which is exactly the air-gapped operator posture.
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-airgap-postgres
          MINIO_ROOT_PASSWORD=ci-airgap-minio-password
          LQ_AI_GATEWAY_KEY=ci-airgap-gateway-key
          JWT_SECRET=ci-airgap-jwt-secret-0123456789abcdef0123456789abcdef
          EOF

      - name: Build images (network still open)
        # Mirrors the build order in scripts/stack-smoke.sh: api,
        # ingest-worker and arq-worker share the ./api context and are
        # byte-identical, so build once and tag — building all three
        # concurrently can exhaust runner disk mid-extraction.
        run: |
          docker compose build gateway web
          docker compose build api
          docker tag lq-ai-api:latest lq-ai-ingest-worker:latest
          docker tag lq-ai-api:latest lq-ai-arq-worker:latest

      - name: Pull pinned third-party images (network still open)
        run: docker compose --profile local pull postgres redis minio ollama

      - name: Pre-fetch the Ollama model (network still open)
        # Starting only the ollama service also creates the compose
        # network, which the seal and canary below attach to. The model
        # lands in the `ollamadata` named volume and survives the
        # --force-recreate of the sealed boot.
        run: |
          docker compose --profile local up -d --wait --wait-timeout 300 ollama
          docker compose exec -T ollama ollama pull "$AIRGAP_MODEL"
          docker compose exec -T ollama ollama list

      - name: Seal the compose bridge (deny all egress)
        run: ./scripts/airgap/deny-egress.sh seal

      - name: Start the egress canary
        run: ./scripts/airgap/capture-egress.sh start sealed

      - name: Boot the full stack under the seal
        # Fresh containers (--force-recreate) so every first-boot path —
        # alembic migrations, gateway.yaml seeding, first-run admin
        # bootstrap — executes with zero network. --no-build: everything
        # was built pre-seal; a build here would mean the seal window
        # missed something.
        run: docker compose --profile local up -d --wait --wait-timeout 900 --no-build --force-recreate

      - name: Drive login -> chat -> Tier-1 response
        run: ./scripts/airgap/drive-smoke.sh

      - name: Assert zero successful egress (inventory blocked attempts)
        # Hard-fails only on BREACH packets (replies from non-private
        # sources = egress got past the seal). Blocked outbound attempts
        # — upstream phone-home behavior that would simply fail in a
        # true air gap — are inventoried with container attribution into
        # sealed.attempts.txt in the evidence artifact, and surfaced in
        # the job summary. First live run (2026-07-25) showed 24 such
        # blocked attempts from three containers; the seal held.
        run: |
          ./scripts/airgap/capture-egress.sh stop sealed
          ./scripts/airgap/capture-egress.sh assert-clean sealed
          if [ -f airgap-artifacts/sealed.attempts.txt ]; then
            {
              echo '### Attempted (blocked) egress inventory'
              echo '```'
              cat airgap-artifacts/sealed.attempts.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Negative control — prove the seal and canary actually work
        # From inside the sealed gateway container (the one component
        # that would legitimately egress in cloud mode), attempt real
        # egress. Both attempts MUST fail at the seal — no provider key
        # is needed to prove that a cloud adapter's endpoint is
        # unreachable. The attempt's SYNs MUST appear in a second
        # capture on the same interface with the same filter, proving
        # the clean pcap above could not be a mis-wired no-op.
        run: |
          ./scripts/airgap/capture-egress.sh start negative
          docker compose exec -T gateway python - <<'PY'
          import socket
          import sys
          import urllib.request

          # Deterministic probe: fixed public IP, no DNS involved.
          try:
              socket.create_connection(("1.1.1.1", 443), timeout=10)
          except OSError as exc:
              print(f"negative-control OK: direct connect blocked ({exc!r})")
          else:
              print("negative-control FAIL: reached 1.1.1.1:443 through the seal", file=sys.stderr)
              sys.exit(1)

          # Realistic probe: the cloud provider endpoint the shipped
          # gateway.yaml.example points its Tier-4 adapter at.
          try:
              urllib.request.urlopen("https://api.anthropic.com", timeout=10)
          except Exception as exc:
              print(f"negative-control OK: api.anthropic.com unreachable ({exc!r})")
          else:
              print("negative-control FAIL: reached api.anthropic.com through the seal", file=sys.stderr)
              sys.exit(1)
          PY
          ./scripts/airgap/capture-egress.sh stop negative
          ./scripts/airgap/capture-egress.sh assert-attempts negative

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p airgap-artifacts
          {
            echo "== docker compose ps -a"
            docker compose ps -a
            echo
            echo "== iptables state"
            ./scripts/airgap/deny-egress.sh status
          } > airgap-artifacts/state.txt 2>&1 || true
          docker compose logs --no-color > airgap-artifacts/compose-logs.txt 2>&1 || true

      - name: Upload pcaps and diagnostics
        # The (empty) sealed pcap + the (non-empty) negative pcap are
        # the evidence artifacts the runbook points auditors at.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: airgap-evidence
          path: airgap-artifacts/
          if-no-files-found: ignore
          retention-days: 30
