name: Docs site

# Builds the public documentation site (ADR 0028) and deploys it to GitHub Pages.
#
#   - On a pull request: build and run every gate, then upload the built site as
#     an artifact. Pages refuses deploys from branches and PRs (the github-pages
#     environment allows `main` only), so a PR build is a check plus a downloadable
#     artifact until preview hosting is decided — ADR 0028, "Explicitly not decided".
#   - On a push to main: the same build, then deploy.
#
# The site is a curated façade over files that live all over the repository, so
# the path filter is wide: a change to README.md or to a skill's frontmatter can
# change a page as surely as a change under site/.
#
# Every action is pinned to a full commit SHA with the version in a trailing
# comment, matching ci.yml. This workflow lives under .github/workflows/, so
# CODEOWNERS routes it to security review.

on:
  pull_request:
    branches: ["**"]
    paths:
      - "site/**"
      - "docs/**"
      - "skills/**"
      - "deploy/**"
      # The generated `/reference/` pages are parsed out of these at build time.
      # Without them a settings change ships while the published reference still
      # describes the previous release — a stale page nothing would announce.
      - "api/app/config.py"
      - "api/app/skills/schema.py"
      - "gateway/app/config.py"
      - "gateway.yaml.example"
      - "mcp.yaml.example"
      - "docker-compose.yml"
      - "README.md"
      - "SECURITY.md"
      - "GOVERNANCE.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "NOTICES.md"
      - ".github/workflows/docs-site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "skills/**"
      - "deploy/**"
      # The generated `/reference/` pages are parsed out of these at build time.
      # Without them a settings change ships while the published reference still
      # describes the previous release — a stale page nothing would announce.
      - "api/app/config.py"
      - "api/app/skills/schema.py"
      - "gateway/app/config.py"
      - "gateway.yaml.example"
      - "mcp.yaml.example"
      - "docker-compose.yml"
      - "README.md"
      - "SECURITY.md"
      - "GOVERNANCE.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "NOTICES.md"
      - ".github/workflows/docs-site.yml"

permissions:
  contents: read

# One Pages deployment at a time. `cancel-in-progress: false` because cancelling
# a deploy mid-flight can leave the live site part-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        # fetch-depth: 0 — every page is stamped with the newest commit touching
        # it or any of its sources, which the transform reads out of git history.
        # A shallow clone silently produces wrong stamps rather than failing.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Set up Python
        # For `check:docs-links`, which runs docs/audits/check_doc_links.py.
        # Standard library only, so there is nothing to install or cache.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Build and run every gate
        # `check` = build + internal links + orphans + palette contrast +
        # WCAG 2.1 AA (pa11y-ci over the built pages) + repo link audit.
        run: npm run check

      - name: Configure Pages
        # Reads the repository's Pages settings so the deploy step has them.
        # Only on `push`: it calls the Pages API, which a pull_request token
        # from a fork cannot reach, and nothing in the build depends on its
        # output — the base path comes from SITE_BASE in astro.config.mjs.
        if: github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      # Narrower than the job needs elsewhere: `pages: write` to publish and
      # `id-token: write` for the OIDC token the deploy action exchanges.
      # `contents` stays read-only from the top-level default.
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
