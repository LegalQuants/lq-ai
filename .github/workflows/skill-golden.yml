# Skill golden harness (DE-231). Nightly + manual dispatch.
#
# Runs the structural golden tests in tests/golden/ against a freshly
# booted compose stack, using the NORMAL api chat-send path — i.e. real
# inference through the gateway, which needs a provider key configured
# as a repository secret (ANTHROPIC_API_KEY or OPENAI_API_KEY).
#
# Honesty invariant: when no provider-key secret is configured, the job
# SUCCEEDS with a prominent "skipped: no keys configured" summary — it
# never pretends the goldens ran. The keyless half of DE-231 (corpus
# format + heuristics, tests/golden/test_golden_inventory.py) runs in
# the regular per-PR pytest path, not here.
#
# On a below-threshold failure this workflow files (or refreshes) a
# release-blocking issue carrying the machine-readable failure reports,
# per DE-231's "regression blocks release" contract.
#
# Cost note: one full run = 30 fixtures x 1 model alias of real
# inference plus a cold compose build (~20-30 min). That is why this is
# nightly/dispatch-only and never per-PR.

name: Skill goldens

on:
  schedule:
    # Nightly, 03:17 UTC — offset from the mutation run to avoid
    # stacking scheduled jobs at midnight.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      record:
        description: >
          Record mode (LQ_GOLDEN_RECORD=1): range misses do not fail;
          observed sidecars are uploaded for maintainer calibration of
          the provisional snapshots.
        type: boolean
        default: false
      skills:
        description: >
          Optional comma-separated skill-slug filter
          (LQ_GOLDEN_SKILLS), e.g. "nda-review,contract-qa".
        type: string
        default: ""

concurrency:
  group: skill-golden
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  golden:
    name: Run skill goldens against the compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check provider-key secrets
        # Secrets are not readable in `if:` expressions, so expose them
        # to this one step and publish a boolean output. When absent,
        # the job ends green with an explicit skip notice — never a
        # silent or fake pass.
        id: guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY}" ] || [ -n "${OPENAI_API_KEY}" ]; then
            echo "have_keys=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_keys=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Skill goldens: SKIPPED — no provider keys configured"
              echo
              echo "Neither \`ANTHROPIC_API_KEY\` nor \`OPENAI_API_KEY\` is set as a"
              echo "repository secret, so the live golden tests **did not run**."
              echo "This job succeeding does NOT mean the skills were exercised."
              echo "Configure a provider-key secret to enable the nightly gate."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skill-golden: skipped — no provider keys configured"
          fi

      - name: Free runner disk space
        if: steps.guard.outputs.have_keys == 'true'
        # Same reclaim as stack-smoke.yml: the api image family needs
        # far more space than the default runner offers.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/lib/jvm /usr/share/swift \
            /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules
          sudo docker image prune -af
          df -h /

      - name: Write .env with provider keys
        if: steps.guard.outputs.have_keys == 'true'
        # stack-smoke.sh writes a dummy .env only when none exists;
        # pre-writing one here injects the real provider keys the
        # gateway needs for inference. Non-key secrets are run-scoped
        # throwaways (the stack is destroyed with the runner).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=ci-golden-postgres
          MINIO_ROOT_PASSWORD=ci-golden-minio-password
          LQ_AI_GATEWAY_KEY=ci-golden-gateway-key
          JWT_SECRET=$(openssl rand -hex 32)
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          EOF

      - name: Build and boot the compose stack
        if: steps.guard.outputs.have_keys == 'true'
        # Reuses the battle-tested stack-smoke boot path (build order,
        # image tagging, healthcheck wait, diagnostics on failure). The
        # soak is shortened — this job's signal is the golden run, not
        # boot stability.
        run: SOAK_SECONDS=5 ./scripts/stack-smoke.sh

      - name: Bootstrap api credentials
        if: steps.guard.outputs.have_keys == 'true'
        # The api mints a first-run admin (admin@lq.ai) and prints its
        # password once to the logs; ActiveUser endpoints are gated
        # until that password is rotated. Rotate it to a run-scoped
        # random value and hand it to the harness via the environment.
        run: |
          set -euo pipefail
          PW=$(docker compose logs api 2>&1 \
            | grep "First-run admin password" | tail -1 | sed 's/.*): //' | tr -d '[:space:]')
          if [ -z "$PW" ]; then
            echo "::error::could not extract the first-run admin password from api logs"
            exit 1
          fi
          echo "::add-mask::$PW"
          LOGIN=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@lq.ai\",\"password\":\"$PW\"}")
          TOKEN=$(echo "$LOGIN" | jq -r .access_token)
          MUST=$(echo "$LOGIN" | jq -r .user.must_change_password)
          if [ "$MUST" = "true" ]; then
            NEWPW="golden-$(openssl rand -hex 16)"
            echo "::add-mask::$NEWPW"
            curl -fsS -o /dev/null -X POST http://127.0.0.1:8000/api/v1/auth/change-password \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -d "{\"current_password\":\"$PW\",\"new_password\":\"$NEWPW\"}"
            PW="$NEWPW"
          fi
          echo "LQ_GOLDEN_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Set up Python
        if: steps.guard.outputs.have_keys == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        if: steps.guard.outputs.have_keys == 'true'
        # The harness is deliberately lightweight: pytest + httpx +
        # pyyaml, no api/gateway package install needed.
        run: pip install "pytest>=8" "httpx>=0.27" "pyyaml>=6.0,<7"

      - name: Run the golden harness
        if: steps.guard.outputs.have_keys == 'true'
        env:
          LQ_GOLDEN_LIVE: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LQ_GOLDEN_REPORT_DIR: golden-report
          LQ_GOLDEN_RECORD: ${{ inputs.record && '1' || '' }}
          LQ_GOLDEN_SKILLS: ${{ inputs.skills }}
        run: pytest tests/golden -m golden_live -q

      - name: Upload reports and observed sidecars
        if: always() && steps.guard.outputs.have_keys == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-reports
          path: |
            golden-report/
            skills/*/acceptance/snapshots/*.observed.json
          if-no-files-found: ignore
          retention-days: 30

      - name: File or refresh the release-blocking issue
        if: failure() && steps.guard.outputs.have_keys == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY=issue-body.md
          {
            echo "The nightly skill golden run fell below its structural thresholds."
            echo
            echo "Run: ${RUN_URL}"
            echo
            if ls golden-report/*.json >/dev/null 2>&1; then
              echo "### Failing fixtures"
              echo
              for f in golden-report/*.json; do
                jq -r 'select(.result.passed == false) |
                  "- **\(.skill) / \(.fixture)** (snapshot: \(.snapshot_status)):\n" +
                  ( .result.failures | map("  - `\(.check)` expected \(.expected), observed \(.observed)") | join("\n") )' \
                  "$f" || true
              done
              echo
              echo "Full machine-readable reports are in the \`golden-reports\` artifact of the run above."
            else
              echo "No per-fixture reports were produced — the failure happened before the"
              echo "harness ran (likely stack boot or credential bootstrap). See the run logs."
            fi
            echo
            echo "Per DE-231 this issue is release-blocking: resolve (fix the skill, the"
            echo "harness, or — after maintainer review of observed values — recalibrate"
            echo "the snapshot ranges) before the next release. See tests/golden/README.md."
          } > "$BODY"
          gh label create golden-regression --description "Skill golden threshold regression (DE-231)" --color B60205 2>/dev/null || true
          gh label create release-blocking --description "Blocks the next release" --color B60205 2>/dev/null || true
          TITLE="Skill golden regression (release-blocking)"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file "$BODY"
            echo "refreshed existing issue #$NUM"
          else
            gh issue create --title "$TITLE" \
              --label golden-regression --label release-blocking \
              --body-file "$BODY"
          fi
