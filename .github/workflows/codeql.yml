# CodeQL static analysis (SAST) — DE-222 supporting workflow; roadmap item 3.4.
#
# Serves two purposes:
#   - the substantive one: query-based SAST over the Python services
#     (api/, gateway/, scripts/) and the TypeScript/JavaScript frontend
#     (web/) on every PR and weekly against main;
#   - the Scorecard SAST check, which specifically looks for
#     github/codeql-action runs (other SAST tools score lower).
#
# Kept deliberately lean per the supply-chain memo: default query suite,
# build-mode: none (no compiled languages here), no extra packs. Findings
# land under Security → Code scanning.

name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1" # weekly, Mondays 03:30 UTC

# Cancel in-flight runs for the same branch when a new push lands.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny; the analyze job declares its own write scope.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # upload CodeQL results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
          - language: javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: ${{ matrix.language }}
          # Interpreted languages only — no build step required or attempted.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          category: "/language:${{ matrix.language }}"
