name: CI

# PR-validation workflow. Triggered on PRs targeting any branch and on
# pushes to the default branch so post-merge state is also validated.
#
# Scope (per docs/SESSION-HANDOFF-2026-05-12-wave-d1-close.md §4 item 2):
#   - web/    : svelte-check + Vitest
#   - api/    : ruff + mypy (standard mode) + pytest (with Postgres)
#   - gateway/: ruff + mypy --strict + pytest
#
# Out of scope (deferred to future waves):
#   - Cypress E2E (heavier; needs a stack-up step + LLM provider keys)
#   - Coverage gates (no-decrease enforcement)
#   - Dependency-license check (likely Wave F polish)
#
# Runtime boot validation (full compose build + up --wait + soak) lives in
# stack-smoke.yml and runs on dependency-manifest PRs, pushes to main, and
# manual dispatch — see issue #283.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# Cancel in-flight runs for the same branch when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-checks:
    name: Web (svelte-check + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # Cypress ships a large binary fetched from download.cypress.io on
        # postinstall. This job runs svelte-check and Vitest only, and no
        # workflow in the repo invokes Cypress, so the download is pure
        # risk: a CDN blip reds a PR that never touched web/. Scoped to
        # this step so a future Cypress job installs the binary normally.
        env:
          CYPRESS_INSTALL_BINARY: "0"
        run: npm ci

      - name: svelte-check (typecheck — LQ.AI-owned code)
        run: npm run check:lq-ai

      - name: Vitest (unit tests)
        run: npm run test:frontend -- --run

  api-checks:
    name: API (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # Postgres service container — api/tests/conftest.py creates a fresh
    # per-run database from this connection (see DATABASE_URL below).
    # Image matches docker-compose.yml: pgvector/pgvector:pg16 carries the
    # pgvector extension binary that migrations require (CREATE EXTENSION
    # IF NOT EXISTS vector). Plain postgres:16-alpine omits it.
    # Pinned by multi-arch index digest (supply-chain hardening, same as the
    # action SHA pins); bump the digest when moving to a newer pg16 build.
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ad2e18408bf447f62092a8a5259e7df10505c5a0360bd1a1853ac8b8b0763da2
        env:
          POSTGRES_USER: lq_ai
          POSTGRES_PASSWORD: lq_ai
          POSTGRES_DB: lq_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lq_ai -d lq_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # asyncpg URL form per api/tests/conftest.py.
      DATABASE_URL: postgresql+asyncpg://lq_ai:lq_ai@localhost:5432/lq_ai

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Cache uv download cache
        # Keyed strictly on api/uv.lock so the cache only invalidates when
        # dependencies change. The uv download cache (~/.cache/uv) holds
        # pre-fetched wheel files; uv sync --frozen skips the network entirely
        # on a cache hit, saving ~30s per run. restore-keys allows a partial
        # hit when the lockfile changes (avoids a full cold download).
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: uv-api-${{ runner.os }}-${{ hashFiles('api/uv.lock') }}
          restore-keys: |
            uv-api-${{ runner.os }}-

      - name: Install uv
        # Exact pin so local == CI lockfile semantics; keep in step with the
        # ghcr.io/astral-sh/uv tag in the Dockerfiles (ADR 0023) and bump
        # deliberately.
        run: pip install uv==0.12.0

      - name: Configure Postgres (fsync=off for test speed)
        # fsync=off is safe for throwaway test databases and eliminates
        # disk-flush overhead on write-heavy fixtures. Applies to all
        # connections including the per-worker databases created by xdist.
        # ALTER SYSTEM writes to postgresql.auto.conf; pg_reload_conf()
        # signals the postmaster to re-read it (fsync has PGC_SIGHUP context).
        # POSTGRES_USER is a superuser in the postgres Docker image by default.
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql -U lq_ai -d postgres
          -c "ALTER SYSTEM SET fsync = off;"
          -c "SELECT pg_reload_conf();"

      - name: uv lock --check (lockfile freshness gate — ADR 0023)
        # Fails when pyproject.toml has drifted from the committed uv.lock,
        # so a manifest change can never land without its re-locked tree.
        run: uv lock --check

      - name: Install api package + dev extras from the lock
        # --frozen installs exactly the committed uv.lock. The synced venv
        # goes on PATH so the ruff/mypy/pytest steps below use it as-is.
        run: |
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: ruff check (api + scripts via root config)
        # The repo-root ruff.toml excludes web/ and applies to api+gateway+scripts.
        # Run from repo root so the config is picked up correctly.
        working-directory: ${{ github.workspace }}
        run: ruff check api scripts

      - name: ruff format --check
        working-directory: ${{ github.workspace }}
        run: ruff format --check api scripts

      - name: mypy (standard mode)
        run: mypy app

      - name: pytest
        # -n auto: one worker per available CPU (4 on ubuntu-latest).
        # Each worker gets its own session-scoped DB and Alembic migration run
        # (see api/tests/conftest.py) — no shared mutable state between workers.
        run: pytest -n auto -q

  gateway-checks:
    name: Gateway (ruff + mypy --strict + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        # No dependency cache: setup-python only caches pip's wheel cache,
        # which the uv-managed install below never touches. api-checks gained
        # a SHA-pinned actions/cache step for ~/.cache/uv in issue #560;
        # the equivalent for gateway is a follow-up.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        # Exact pin so local == CI lockfile semantics; keep in step with the
        # ghcr.io/astral-sh/uv tag in the Dockerfiles (ADR 0023) and bump
        # deliberately.
        run: pip install uv==0.12.0

      - name: uv lock --check (lockfile freshness gate — ADR 0023)
        # Fails when pyproject.toml has drifted from the committed uv.lock,
        # so a manifest change can never land without its re-locked tree.
        run: uv lock --check

      - name: Install gateway package + dev extras from the lock
        # --frozen installs exactly the committed uv.lock. The synced venv
        # goes on PATH so the ruff/mypy/pytest steps below use it as-is.
        run: |
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: ruff check
        working-directory: ${{ github.workspace }}
        run: ruff check gateway

      - name: ruff format --check
        working-directory: ${{ github.workspace }}
        run: ruff format --check gateway

      - name: mypy --strict (per CLAUDE.md)
        run: mypy app

      - name: pytest
        run: pytest -q
