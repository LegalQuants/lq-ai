version: 2
updates:
  # ADR 0023 — api/ and gateway/ run the uv ecosystem (pyproject.toml +
  # uv.lock), so updates arrive as lock-pinned version bumps with concrete
  # name+version diffs rather than range widenings. The cooldown holds a
  # bump until the release is at least 7 days old — the release-age posture
  # dependency review already applies by hand at the security boundary.
  #
  # Grouping is a merge-throughput measure, not a review shortcut. CI gates
  # lock freshness with `uv lock --check` (ADR 0023), so a lockfile admits
  # one write at a time: N separate PRs against the same lock must merge
  # strictly serially, each waiting a full CI cycle after a rebase. One
  # grouped PR is one lock write.
  #
  # Three things stay deliberately ungrouped:
  #   - security updates — `applies-to: version-updates` scopes the group,
  #     so an advisory fix is never queued behind routine hygiene;
  #   - majors — omitted from `update-types`, since each needs its own read.
  #   - langgraph — excluded by name from api-minor-patch. The two above are
  #     policy classes; this one is a package, and it is here because the
  #     majors rule cannot reach it. langgraph is pre-1.0, so its breaking
  #     releases ship as 0.x *minors*: within the group the highest version
  #     an allowed "minor" reaches is 0.6.x, which re-types StateGraph and
  #     fails mypy [call-overload] across all three executors. That bump has
  #     been opened and closed unmerged five times (#68, #176, #482, #520,
  #     #544) — the fix is in our code, not in the pin. docling and mcp get
  #     their own read for free by being post-1.0; langgraph needs the
  #     exclusion to get the same treatment. Lift at DE-319 (#524).
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "api"]
    groups:
      api-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["langgraph"]
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: /gateway
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "gateway"]
    groups:
      gateway-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # web/ is a vendored OpenWebUI fork pinned by ADR 0001, so its npm pins are
  # upstream's rather than ours. Routine currency arrives with the quarterly
  # rebase (#498), which brings upstream's own newer pins with it — a version
  # bump raised between refreshes is superseded before it can be reviewed.
  # That is not hypothetical: #459, #460, #473, #474, #475 and #533 all closed
  # unmerged for exactly this reason.
  #
  # `open-pull-requests-limit: 0` disables *version* updates for this ecosystem.
  # Dependabot **security** updates are unaffected by that limit, so an advisory
  # against a web/ package still opens a PR — which is the coverage we want, and
  # matches ADR 0001's "or earlier if an upstream security fix lands that affects
  # us" clause. The entry is kept rather than deleted so the manifest stays
  # registered and security PRs keep carrying the `web` label.
  #
  # `cooldown` is omitted because it is documented as version-updates-only, and
  # the `web-minor-patch` group because it was scoped `applies-to:
  # version-updates`. Neither reached security updates, so dropping them changes
  # nothing for the one update class this block still produces — and leaving
  # security bumps ungrouped matches the posture the uv blocks above set out.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: ["dependencies", "web"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # #301: container images are pinned by tag *and* multi-arch index digest
  # (e.g. `python:3.12-slim@sha256:...`). The digest is what makes a build
  # reproducible; this block is what stops it going stale. Dependabot keeps
  # the tag@digest form and moves both halves together, so a rebuilt base
  # re-pushed under the same tag (new OS patches, same version) arrives as a
  # digest-only refresh PR.
  #
  # Tag moves are held to patch level. Left alone, Dependabot would also offer
  # comparable tag bumps (3.12-slim -> 3.13-slim, caddy 2 -> 3), and each of
  # those is a runtime change that needs its own read, so semver-minor and
  # semver-major are ignored for every image. Docker cooldown supports only
  # `default-days`, and it holds digest refreshes too: a re-pushed tag is
  # proposed once the push is 7 days old.
  #
  # Known risk: dependabot-core has a server-side experiment
  # (`docker_digest_only_update_suppression`, dependabot-core#15103) that,
  # when GitHub enables it, suppresses digest-only refreshes for comparable
  # tags such as 3.12-slim, 2-alpine, 7-alpine and 1.0.0 (non-comparable tags
  # such as pg16 are unaffected). With minor/major ignored, those pins would
  # then go stale silently. It cannot be toggled from this file; the first
  # Dependabot PRs after merge show whether it is on (#301 follow-up).
  #
  # /deploy/helm/lq-ai (the docker ecosystem reads `image:` strings in the
  # chart's YAML files):
  #   - ADR 0036 §2 names this ecosystem as the bump mechanism for the rustfs
  #     pin in values.yaml. rustfs is also pinned in both compose files (the
  #     docker-compose block below), so one rustfs release opens two PRs:
  #     merge them together so the compose and Helm pins stay identical.
  #   - The chart's pgvector and redis images are tag-only and stay that way;
  #     Dependabot does not add a digest to a tag-only reference by default.
  #   - The chart's own LQ.AI images are split into registry/owner/tag keys and
  #     are not parsed today; the `legalquants/*` ignore keeps them out if that
  #     changes.
  #
  # Bumped by hand, because Dependabot's Dockerfile parser reads FROM lines
  # only: the `# syntax=docker/dockerfile:...@sha256:...` directives and the
  # `COPY --from=ghcr.io/astral-sh/uv:<version>` pins (ADR 0023).
  #
  # `group-by: dependency-name` opens one PR per image across all directories
  # (one python:3.12-slim PR, not one per directory). There is no `docker`
  # label upstream, so these PRs carry `dependencies` only.
  - package-ecosystem: docker
    directories:
      - /api
      - /gateway
      - /slack-bridge
      - /teams-bridge
      - /proxy
      - /deploy/helm/lq-ai
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    ignore:
      - dependency-name: "legalquants/*"
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      docker-images:
        applies-to: version-updates
        group-by: dependency-name
        patterns: ["*"]

  # web/Dockerfile's node and python bases are digest-pinned, even though web/
  # is a vendored OpenWebUI fork (ADR 0001). Check for updates weekly and cap
  # the open PR queue at four. Maintainers review base-image changes separately
  # from the quarterly upstream rebase, including the tag and multi-arch digest.
  #
  # Docker Dependabot PRs are scheduled version updates, not security alerts.
  # Maintainers also watch base-image advisories and can refresh a pin ahead of
  # the rebase when needed. Dependabot may suppress same-tag digest-only updates
  # (dependabot-core#15103), so check the pinned digest when an advisory lands.
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    labels: ["dependencies", "web"]

  # docker-compose.yml and docker-compose.release.yml (same #301 posture as the
  # docker block above: digest refreshes and patch tags only, 7-day cooldown).
  # Locally built `lq-ai-*:latest` images would otherwise be looked up on
  # Docker Hub, hence the ignore; the release file's ghcr.io/${...} images use
  # variable interpolation and are not parsed.
  #
  # Exception: `ollama/ollama:latest@sha256:...` (the `local` profile). `latest`
  # has no version to hold back, so each digest refresh is a real Ollama
  # version upgrade. It is excluded from the group so it arrives as its own
  # PR; review it as an upgrade, not a rebuild.
  #
  # The compose pgvector pin is duplicated in .github/workflows/ci.yml (the
  # Postgres service container), which no ecosystem here updates. When
  # Dependabot bumps pgvector in compose, bump ci.yml by hand in the same PR.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    ignore:
      - dependency-name: "lq-ai-*"
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      compose-images:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["ollama/ollama"]
