            schema:
              $ref: '#/components/schemas/KBQueryRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KBQueryResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Hybrid (vector + FTS) search over the knowledge base
      tags:
      - knowledge-bases
  /api/v1/mcp/oauth:
    get:
      description: 'GET /api/v1/mcp/oauth — per-user OAuth connection status for all
        connectable servers.


        PR4d Ask 1.  ActiveUser-gated (bearer).  Returns one entry per configured

        OAuth-type MCP server with the calling user''s connection state

        (``connected``, ``scopes``, ``expires_at``).  Token bytes are NEVER

        returned — this is a status-only surface.'
      operationId: list_mcp_oauth_api_v1_mcp_oauth_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPOAuthServersResponse'
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: List Mcp Oauth
      tags:
      - mcp-oauth
  /api/v1/mcp/oauth/{server}:
    delete:
      description: 'DELETE /api/v1/mcp/oauth/{server} — revoke stored tokens (local
        only).


        Idempotent: deleting when no token is stored still returns 204.

        Audit row written only when a row was actually removed.'
      operationId: disconnect_mcp_oauth_api_v1_mcp_oauth__server__delete
      parameters:
      - in: path
        name: server
        required: true
        schema:
          title: Server
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Disconnect Mcp Oauth
      tags:
      - mcp-oauth
  /api/v1/mcp/oauth/{server}/authorize:
    get:
      description: 'GET /api/v1/mcp/oauth/{server}/authorize — start the OAuth flow.


        Builds the PKCE authorize URL for *server* and redirects the user''s browser

        to the authorization server.  Audit happens on successful callback, not here.


        ``return_url`` (optional) is an operator-allowlisted frontend URL.  When

        supplied, the callback 302-redirects the browser back to that URL on

        completion (success or exchange error).  The origin of *return_url* MUST be

        in ``lq_ai_cors_origins``; unrecognised origins are rejected with 400 (no

        open redirect).'
      operationId: authorize_mcp_oauth_api_v1_mcp_oauth__server__authorize_get
      parameters:
      - in: path
        name: server
        required: true
        schema:
          title: Server
          type: string
      - in: query
        name: return_url
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Return Url
      responses:
        '302':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Authorize Mcp Oauth
      tags:
      - mcp-oauth
  /api/v1/mcp/oauth/{server}/callback:
    get:
      description: 'GET /api/v1/mcp/oauth/{server}/callback — receive the AS redirect.


        PUBLIC — no bearer auth.  The user is bound to the exchange via the

        single-use, TTL-bounded mcp_oauth_state row inside exchange_code.


        When a ``return_url`` was stored on the state row (set at authorize-time):

        * Success → 302 to ``{return_url}?mcp_connected={server}``

        * Exchange error → 302 to ``{return_url}?mcp_error={code}&server={server}``


        When no ``return_url`` was stored (back-compat):

        * Success → 200 ``MCPOAuthCallbackResponse``

        * Exchange error → raises the exception (existing JSON-error behaviour)


        The callback NEVER reads a redirect target from its own query string.  The

        only trusted ``return_url`` is the one read from the state row (validated

        + stored at authorize-time).  If the state row is unknown, ``return_url``

        is None and we fall back to JSON error (fail safe — no trusted target).'
      operationId: mcp_oauth_callback_api_v1_mcp_oauth__server__callback_get
      parameters:
      - in: path
        name: server
        required: true
        schema:
          title: Server
          type: string
      - in: query
        name: code
        required: true
        schema:
          title: Code
          type: string
      - in: query
        name: state
        required: true
        schema:
          title: State
          type: string
      - in: query
        name: iss
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Iss
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPOAuthCallbackResponse'
          description: Token exchanged (no return_url)
        '302':
          description: Browser redirected to return_url (return_url was supplied)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Mcp Oauth Callback
      tags:
      - mcp-oauth
  /api/v1/mcp/oauth/{server}/status:
    get:
      description: 'GET /api/v1/mcp/oauth/{server}/status — check connection state.


        Returns whether the calling user has a stored token for *server*, plus

        the granted scopes and expiry.  Token bytes are NEVER returned.'
      operationId: status_mcp_oauth_api_v1_mcp_oauth__server__status_get
      parameters:
      - in: path
        name: server
        required: true
        schema:
          title: Server
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPOAuthStatusResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Status Mcp Oauth
      tags:
      - mcp-oauth
  /api/v1/models:
    get:
      description: "Return the gateway's merged ``GET /v1/models`` payload verbatim.\n\
        \nErrors from the gateway client propagate as :class:`LQAIError`\nsubclasses;\
        \ the global exception handler in :mod:`app.main`\ntranslates them to the\
        \ canonical ``{\"detail\": {\"code\", ...}}``\nenvelope. Specifically:\n\n\
        * Gateway 401 (bad shared-secret) → ``GatewayUnreachable`` /\n  HTTP 503 with\
        \ ``code = \"gateway_unreachable\"``. The user must not\n  see \"the operator\
        \ misconfigured the gateway key\".\n* Network failure → ``GatewayUnreachable``\
        \ / HTTP 503.\n* Timeout → ``GatewayTimeout`` / HTTP 504.\n* Structured gateway\
        \ errors → mapped per\n  :func:`app.errors.map_gateway_error_code`.\n\nThe\
        \ success body is forwarded as-is — the client side already\nunderstands the\
        \ gateway's shape (per the OpenAPI sketch)."
      operationId: list_models_api_v1_models_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: List Models
      tags:
      - models
  /api/v1/organization-profile:
    get:
      description: 'GET /api/v1/organization-profile — readable by any authenticated
        user.


        Returns ``content_md=""`` plus null timestamps when no admin has

        set a Profile yet — the read path never 404s. The transparency

        principle (PRD §1.3) requires every user to be able to see what''s

        shaping their output; admins have the *write* side via PUT.'
      operationId: get_organization_profile_api_v1_organization_profile_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProfileResponse'
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Get the deployment's Organization Profile
      tags:
      - organization-profile
    put:
      description: 'PUT /api/v1/organization-profile — admin upsert.


        Idempotent: if a row exists, update its ``content_md`` +

        ``updated_by`` (the trigger maintains ``updated_at``); otherwise

        insert a fresh row. The singleton index guarantees the write

        converges to a single row regardless of concurrency.


        Audit-logged via the D3 helper as ``organization_profile.updated``

        so admins can trace who changed the Profile and when.'
      operationId: put_organization_profile_api_v1_organization_profile_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationProfileUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProfileResponse'
          description: Successful Response
        '401':
          description: Bearer token missing or invalid
        '403':
          description: Caller is not an admin
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update the Organization Profile (admin only)
      tags:
      - organization-profile
  /api/v1/organization-profile/raw:
    get:
      description: 'GET /api/v1/organization-profile/raw — content-typed Markdown.


        Convenience endpoint for the Skill Inspector (§3.4) and any UI

        surface that wants to render the Profile as Markdown without

        JSON-decoding the body. Returns an empty 200 if no Profile is

        set yet (rather than 404), consistent with the JSON GET above.'
      operationId: get_organization_profile_raw_api_v1_organization_profile_raw_get
      responses:
        '200':
          content:
            text/markdown: {}
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Get the Profile as raw Markdown (text/markdown)
      tags:
      - organization-profile
  /api/v1/playbook-executions/{execution_id}:
