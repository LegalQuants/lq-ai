        \ and warrant their own dedicated flow. ``display_name``\nalone unblocks the\
        \ editable-profile experience.\n\nValidation (mirrors how ``UserPreferencesUpdate``\
        \ constrains its\nfields, but for a free-text field):\n\n* ``display_name``\
