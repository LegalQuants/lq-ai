          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberRoleUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Change a member's role within a team (admin)
      tags:
      - admin
      - teams
  /api/v1/admin/tier-policy:
    get:
      description: 'GET /api/v1/admin/tier-policy — operator''s tier policy (admin-only).


        Returns the same shape as ``GET /api/v1/inference/tier-config``;

        the admin variant exists so the admin UI can render the policy on

        the operator console without granting the read endpoint to every

        user (it''s already user-accessible at the non-admin URL, but

        surfacing it under /admin keeps the operator UI''s permission model

        clean).'
      operationId: get_tier_policy_api_v1_admin_tier_policy_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TierPolicyResponse'
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Get Tier Policy
      tags:
      - admin
    patch:
      description: 'PATCH /api/v1/admin/tier-policy — partial-update the tier policy.


        Proxies through to the gateway''s PATCH /admin/v1/tier-config (which

        atomically rewrites ``gateway.yaml`` and reloads the live snapshot).

        Writes a ``tier_policy.updated`` audit row with before/after values

        so a privacy auditor can reconstruct the policy history.'
      operationId: update_tier_policy_api_v1_admin_tier_policy_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TierPolicyPatchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TierPolicyResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update Tier Policy
      tags:
      - admin
  /api/v1/admin/tool-providers:
    get:
      description: List authority-source status via the gateway. No secret is returned.
      operationId: list_tool_providers_api_v1_admin_tool_providers_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Tool Providers Api V1 Admin Tool Providers Get
                type: object
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: List Tool Providers
      tags:
      - admin
    post:
      description: Enable an authority source (+optional key). 400/404 propagate from
        gateway.
      operationId: set_tool_provider_api_v1_admin_tool_providers_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolProviderSetRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Set Tool Provider Api V1 Admin Tool Providers Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Set Tool Provider
      tags:
      - admin
  /api/v1/admin/tool-providers/{provider_type}:
    delete:
      description: 'Disable an authority source. 404/409 propagate from the gateway.


        Uses the canonical DELETE-204 recipe (``response_class=Response`` plus an

        explicit empty ``Response`` return) so the 204 carries a genuinely empty

        body.'
      operationId: disable_tool_provider_api_v1_admin_tool_providers__provider_type__delete
      parameters:
      - in: path
        name: provider_type
        required: true
        schema:
          title: Provider Type
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Disable Tool Provider
      tags:
      - admin
    patch:
      description: Rotate key and/or toggle enabled. 400/404/409 propagate from gateway.
      operationId: patch_tool_provider_api_v1_admin_tool_providers__provider_type__patch
      parameters:
      - in: path
        name: provider_type
        required: true
        schema:
          title: Provider Type
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolProviderPatchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Patch Tool Provider Api V1 Admin Tool Providers  Provider
                  Type  Patch
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Patch Tool Provider
      tags:
      - admin
  /api/v1/admin/usage:
    get:
      description: 'GET /api/v1/admin/usage — cost + tokens aggregations (Wave B /
        PRD §5.5).


        Aggregates ``inference_routing_log`` by one of: user, provider,

        model, tier, day. Filters on the same dimensions plus a date range.

        Refusals are excluded by default (they didn''t consume tokens

        upstream). All counts/sums are returned alongside a deployment-wide

        total so the admin UI can render percentages without a second

        query.'
      operationId: get_usage_api_v1_admin_usage_get
      parameters:
      - in: query
        name: group_by
        required: false
        schema:
          default: provider
          title: Group By
          type: string
      - in: query
        name: date_from
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Date From
      - in: query
        name: date_to
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Date To
      - in: query
        name: user_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
      - in: query
        name: provider
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
      - in: query
        name: model
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      - in: query
        name: tier
        required: false
        schema:
          anyOf:
          - maximum: 5
            minimum: 1
            type: integer
          - type: 'null'
          title: Tier
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Usage
      tags:
      - admin
  /api/v1/admin/users:
    get:
      description: 'GET /api/v1/admin/users — paginated, filtered user list (admin-only).


        Returns all non-deleted users with their full auth state. Supports

        optional filtering by role and email substring. Default sort is

        ``email ASC`` for predictable alphabetical scanning. Pagination via

        ``limit`` + ``offset``; ``total_count`` is the full filtered count

        before pagination so the UI can show "Showing 50 of 187".


        Users with a pending deletion (``deletion_scheduled_at`` set) are

        included so admins can see the grace-period state and act if needed.'
      operationId: list_users_api_v1_admin_users_get
      parameters:
      - in: query
        name: role
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      - in: query
        name: email_q
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Email Q
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List users for RBAC administration (Wave B v2 — PRD §5.2)
      tags:
      - admin
  /api/v1/admin/users/{user_id}/role:
    patch:
      description: 'PATCH /api/v1/admin/users/{user_id}/role — set RBAC role (Wave
        C).


        Admin-only. Updates ``users.role`` and keeps ``is_admin`` in sync

        (True iff role=''admin''). Idempotent: re-applying the same role

        returns 200 without writing an audit row. Writes

        ``user.role_updated`` on real changes with before/after values.


        Refuses to demote the last admin (lockout protection): if the

        target user is the only ``role=''admin''`` row in the deployment

        and the caller is trying to set them to non-admin, returns 409

        so the operator can promote someone else first.'
      operationId: update_user_role_api_v1_admin_users__user_id__role_patch
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          title: User Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update User Role
      tags:
      - admin
  /api/v1/admin/word-addin/manifest:
    get:
      description: 'Render and return the Office Add-in manifest XML for sideload.


        The endpoint is admin-only (``AdminUser`` dep at router level via

        ``api_router``). Returns ``application/xml`` with a

        ``Content-Disposition: attachment`` header so the browser downloads

        the file rather than rendering it as XML in the tab.'
      operationId: get_manifest_api_v1_admin_word_addin_manifest_get
      parameters:
      - description: Override the deployment origin embedded in the manifest. Defaults
          to the request's effective origin (reverse-proxy aware). No trailing slash.
        in: query
        name: deployment_origin
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Override the deployment origin embedded in the manifest. Defaults
            to the request's effective origin (reverse-proxy aware). No trailing slash.
          examples:
          - https://lq.acme.example
          title: Deployment Origin
      - description: Branded name surfaced inside Word's ribbon and the task pane
          GetStarted message.
        in: query
        name: display_name
        required: false
        schema:
          default: LQ.AI
          description: Branded name surfaced inside Word's ribbon and the task pane
            GetStarted message.
          maxLength: 64
          title: Display Name
          type: string
      - description: ProviderName value the manifest surfaces to Microsoft 365 Admin
          Center; typically the operator org's name.
        in: query
        name: provider_name
        required: false
        schema:
          default: LegalQuants
          description: ProviderName value the manifest surfaces to Microsoft 365 Admin
            Center; typically the operator org's name.
          maxLength: 64
          title: Provider Name
          type: string
      responses:
        '200':
          content:
            application/xml: {}
          description: Rendered Office Add-in XML manifest.
        '403':
          description: Caller is not an admin user.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Render the Word add-in manifest XML for sideload (M3-B1).
      tags:
      - admin
  /api/v1/auth/change-password:
    post:
      description: "POST /api/v1/auth/change-password.\n\nBearer-authenticated; the\
        \ bearer token's user is the one whose password\nis being changed. The current\
        \ password is required (defense against\na stolen access token; an attacker\
        \ who only has the token cannot\nrotate the credentials underneath the legitimate\
        \ user).\n\nBehavior:\n- Verifies `current_password` against the stored hash.\n\
        - Validates `new_password` against the configured minimum length and\n  \"\
        must differ from current\" policy.\n- Hashes and stores the new password.\n\
        - Clears `must_change_password` (the first-run forced-change flag).\n- Revokes\
        \ ALL active sessions for the user — the caller must log in\n  again with\
        \ the new password. This is intentional: it invalidates\n  any session that\
        \ may have been spawned with the old credential.\n\nReturns 204 on success,\
        \ 401 on wrong current password, 400 on policy\nviolation. The response body\
        \ for 400 names the violated rule so the\nUI can render a usable message."
      operationId: change_password_api_v1_auth_change_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '204':
          description: Password changed successfully
        '400':
          description: New password fails policy check
        '401':
          description: Current password is wrong
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Change the calling user's password
      tags:
      - auth
  /api/v1/auth/login:
    post:
      description: POST /api/v1/auth/login — see backend-openapi.yaml.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Successful Response
        '401':
          description: Invalid credentials
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '423':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallenge'
          description: MFA required
      summary: Authenticate with email and password
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: 'POST /api/v1/auth/logout — bearer-authenticated.


        Revokes ALL active sessions for the calling user (conservative — see

        PRD §5.1; per-session logout can be added later if a use case

        materializes). The access token itself is stateless and remains valid

        until its TTL expires; clients are expected to discard it on logout.'
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Revoke all active sessions for the calling user
      tags:
      - auth
  /api/v1/auth/mfa/disable:
    post:
      description: 'POST /api/v1/auth/mfa/disable — require password + MFA code together.


        Both checks are required so a stolen access token alone cannot

        weaken the user''s authentication posture, and an attacker who has

        the password but not the device cannot strip MFA.


        Wrong-password and wrong-code branches both return generic 401 so

        callers can''t tell which leg failed.'
      operationId: mfa_disable_api_v1_auth_mfa_disable_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaDisableRequest'
        required: true
      responses:
        '204':
          description: MFA disabled
        '400':
          description: MFA is not enabled
        '401':
          description: Wrong password or invalid MFA code
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Disable MFA after re-proving password and a current MFA code
      tags:
      - auth
  /api/v1/auth/mfa/enable:
    post:
      description: 'POST /api/v1/auth/mfa/enable — flip ``mfa_enabled`` after first
        verify.


        Requires that ``/mfa/setup`` has been called first (a pending

        ``totp_secret`` is on the user row). On success the user''s next

        login will receive the 423 challenge.'
      operationId: mfa_enable_api_v1_auth_mfa_enable_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnableRequest'
        required: true
      responses:
        '204':
          description: MFA enabled
        '400':
          description: Setup not started or code invalid
        '409':
          description: MFA already enabled
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Confirm TOTP enrollment with a verification code
      tags:
      - auth
  /api/v1/auth/mfa/setup:
    post:
      description: 'POST /api/v1/auth/mfa/setup — issue a fresh TOTP secret + recovery
        codes.


        Re-running setup before ``/mfa/enable`` overwrites the pending

        secret + codes (the user is restarting enrollment). Re-running

        after MFA is already enabled is a 409 ``mfa_already_enabled``;

        the user must call ``/mfa/disable`` first.'
      operationId: mfa_setup_api_v1_auth_mfa_setup_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupResponse'
          description: Successful Response
        '409':
          description: MFA already enabled
      security:
      - OAuth2PasswordBearer: []
      summary: Enroll in TOTP-based MFA
      tags:
      - auth
  /api/v1/auth/mfa/verify:
    post:
      description: 'POST /api/v1/auth/mfa/verify — redeem an mfa_token + code → LoginResponse.


        On success, mints the same session shape as a regular login (the

        issuance path is shared — see ``_create_session`` and

        ``_login_response``).


        All failure modes (invalid token, expired token, missing user,

        MFA-not-enabled, wrong code) collapse into a single 401 so an

        attacker cannot probe which leg failed.'
      operationId: mfa_verify_api_v1_auth_mfa_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Successful Response
        '401':
          description: Invalid challenge token or code
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Complete MFA challenge with TOTP or recovery code
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: POST /api/v1/auth/refresh — rotate the refresh token, mint a new
        access token.
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: Successful Response
        '401':
          description: Invalid, expired, or revoked refresh token
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Refresh access token using refresh token
      tags:
      - auth
  /api/v1/autonomous/memory:
    get:
      description: 'GET /api/v1/autonomous/memory


        Returns the caller''s non-deleted memory entries ordered by

        ``created_at DESC``.  Pass ``?state=proposed|kept|dismissed`` to

        filter by review state; omitting ``state`` returns all non-deleted

        entries.  Pass ``?source_session_id=`` to narrow to the memories a

        specific run proposed (the run''s "memories this run proposed" view).

        ``limit`` is clamped to [1, 200]; ``offset`` to [0, ∞).'
      operationId: list_memory_api_v1_autonomous_memory_get
      parameters:
      - in: query
        name: state
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MemoryState'
          - type: 'null'
          title: State
      - in: query
        name: source_session_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Source Session Id
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousMemoryListResponse'
          description: Successful Response
        '401':
          description: Not authenticated
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List the calling user's autonomous memory entries (non-deleted, newest
        first)
      tags:
      - autonomous
  /api/v1/autonomous/memory/{memory_id}:
    delete:
      description: 'DELETE /api/v1/autonomous/memory/{memory_id}


        Soft-deletes the entry by setting ``deleted_at=now(UTC)``.  Returns

        **200** with the updated (deleted) entry rather than 204 to avoid the

        FastAPI ``JSONResponse``/204 assertion pitfall (documented in

        CLAUDE.md).


        A subsequent GET excludes the entry; keep/dismiss/delete on a deleted

        entry return 404 (``_load_owned_memory`` filters ``deleted_at IS NULL``).


        Audited.'
      operationId: delete_memory_api_v1_autonomous_memory__memory_id__delete
      parameters:
      - in: path
        name: memory_id
        required: true
        schema:
          format: uuid
          title: Memory Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousMemoryRead'
          description: Successful Response
        '401':
          description: Not authenticated
        '404':
          description: Memory entry not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Soft-delete an autonomous memory entry (returns 200 with updated entry)
      tags:
      - autonomous
  /api/v1/autonomous/memory/{memory_id}/dismiss:
    post:
      description: 'POST /api/v1/autonomous/memory/{memory_id}/dismiss


        Transitions ``proposed`` or ``kept`` → ``dismissed``.


        Returns the updated entry.  Audited.'
      operationId: dismiss_memory_api_v1_autonomous_memory__memory_id__dismiss_post
      parameters:
      - in: path
        name: memory_id
        required: true
        schema:
          format: uuid
          title: Memory Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousMemoryRead'
          description: Successful Response
        '401':
          description: Not authenticated
        '404':
          description: Memory entry not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Dismiss an autonomous memory entry
      tags:
      - autonomous
  /api/v1/autonomous/memory/{memory_id}/keep:
    post:
      description: 'POST /api/v1/autonomous/memory/{memory_id}/keep


        Transitions ``proposed`` or ``dismissed`` → ``kept``.  If

        ``body.content`` is provided, overwrites the entry''s text (edit-on-keep).


        **Re-keep semantics:** if the entry is already ``kept``, the action is

        allowed — content is updated if provided; ``kept_at`` is left as-is

        (preserves the original keep timestamp).


        Returns the updated entry.  Audited.'
      operationId: keep_memory_api_v1_autonomous_memory__memory_id__keep_post
      parameters:
      - in: path
        name: memory_id
        required: true
        schema:
          format: uuid
          title: Memory Id
          type: string
      requestBody:
