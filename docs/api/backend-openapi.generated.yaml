  /api/v1/integrations/slack/workspaces:
    post:
      description: "Persist (or upsert) the workspace record from the bridge.\n\n\
        Upserts on ``team_id``. On conflict:\n  * ``team_name`` is refreshed from\
        \ the request body (operator may\n    have renamed the workspace in Slack).\n\
        \  * ``bot_token_encrypted`` is replaced (Slack rotates tokens on\n    re-install).\n\
        \  * ``bot_user_id`` is refreshed (Slack may have issued a new bot\n    user\
        \ across the re-install).\n  * ``installer_slack_user_id`` is refreshed (a\
        \ different operator\n    may be reinstalling).\n  * ``scope`` is replaced\
        \ (consent may have changed).\n  * ``deleted_at`` is set back to NULL (re-install\
        \ revives soft-\n    deleted rows).\n  * ``installed_at`` stays at the original\
        \ install time; the\n    re-install does not reset the audit timestamp. Operators\
        \ can\n    infer re-install activity from the bot-token ciphertext\n    changing\
        \ without the install timestamp moving."
      operationId: upsert_slack_workspace_api_v1_integrations_slack_workspaces_post
      parameters:
      - in: header
        name: Authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlackWorkspaceCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
