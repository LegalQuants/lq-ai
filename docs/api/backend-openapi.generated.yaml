      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybookExecutionCreate'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybookExecution'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Kick off a playbook execution against a target document.
      tags:
      - playbooks
