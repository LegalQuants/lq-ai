  /api/v1/admin/intake-bridges:
    get:
      description: 'Return live (non-soft-deleted) Slack workspaces + Teams tenants.


        Sorted by ``installed_at DESC`` within each section so the most

        recently connected bridge surfaces first.'
      operationId: list_intake_bridges_api_v1_admin_intake_bridges_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeBridgesList'
