  /api/v1/internal/skills/{skill_name}:
    get:
      description: "Return resolved skill detail for ``skill_name``.\n\nSame response\
        \ shape as ``GET /api/v1/skills/{skill_name}`` — the\nfull ``Skill`` from\
        \ ``docs/api/backend-openapi.yaml``, with\n``None``-valued optionals dropped\
        \ for compactness. Auth is via\n``X-LQ-AI-Gateway-Key`` (constant-time compare);\
        \ 401 on bad key,\n404 on unknown skill name.\n\nResolution order (ADR 0012\
        \ + D8.1b):\n\n1. ``user_id`` set + non-archived user-scope row for that user\n\
        \   at this slug → return the user shadow.\n2. ``user_id`` set + non-archived\
        \ team-scope row at this slug\n   owned by any team that user belongs to →\
        \ return the team\n   shadow. Multi-team conflicts resolve to the row with\
        \ the\n   most recent ``updated_at``.\n3. Filesystem-canonical registry →\
        \ return the built-in.\n4. 404 if none of the three match.\n\nThe gateway\
        \ calls this with the authenticated user's UUID during\nC2 prompt assembly\
        \ so shadows actually shape the system prompt;\ncallers that don't care about\
        \ user-scope (e.g., admin tooling)\nomit ``user_id`` and get the registry\
        \ view directly.\n\nCache key strategy (D8.1b decision): the gateway-side\
        \ cache stays\nkeyed on ``(name, user_id)``. Team-membership changes are\n\
        operator-mediated and rare; the existing 60s skill-cache TTL\nabsorbs propagation\
        \ lag without a per-membership signature in\nthe key. Re-evaluate if team-membership\
        \ churn becomes routine."
      operationId: get_skill_internal_api_v1_internal_skills__skill_name__get
      parameters:
      - in: path
        name: skill_name
        required: true
        schema:
          title: Skill Name
          type: string
      - in: query
        name: user_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: User Id
      - in: header
        name: X-LQ-AI-Gateway-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Lq-Ai-Gateway-Key
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Skill Internal
      tags:
      - internal
