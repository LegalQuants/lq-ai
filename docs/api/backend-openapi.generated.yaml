        * ``description`` — what makes this tier acceptable\n  (e.g., \"12-month liability\
        \ cap\" vs. the standard \"uncapped\").\n* ``language`` — the actual clause\
        \ text the playbook will accept.\n\nStored as JSONB on ``playbook_positions.fallback_tiers``\
        \ so\nadditional fields (e.g., approval workflow, escalation contact)\ncan\
        \ land in a future iteration without a schema migration."
