      summary: List the calling user's autonomous watches (non-deleted, newest first)
      tags:
      - autonomous
    post:
      description: 'POST /api/v1/autonomous/watches


        Validates the caller **owns** the target ``knowledge_base_id``

        (``KnowledgeBase.owner_id == user.id``) — a KB the caller cannot see

        returns 404 (conservative per-user isolation; KB-sharing is out of

        scope). Creates the watch row. Returns the created

        :class:`~app.schemas.autonomous.AutonomousWatchRead` (201).


        Audited.'
      operationId: create_watch_api_v1_autonomous_watches_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutonomousWatchCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousWatchRead'
          description: Watch created
        '401':
          description: Not authenticated
        '404':
          description: Target knowledge base or referenced project not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create an autonomous watch (KB-arrival-triggered run definition)
      tags:
      - autonomous
  /api/v1/autonomous/watches/{watch_id}:
    delete:
      description: 'DELETE /api/v1/autonomous/watches/{watch_id}


        Soft-deletes the watch by setting ``deleted_at=now(UTC)``.  Returns

        **200** with the updated (deleted) entity rather than 204 to avoid the

        FastAPI ``JSONResponse``/204 assertion pitfall (documented in

        CLAUDE.md).


        A subsequent GET excludes the watch; patch/delete on a deleted watch

        return 404 (``_load_owned_watch`` filters ``deleted_at IS NULL``). The

        KB-arrival trigger also skips soft-deleted rows.


        Another user''s ``watch_id`` returns 404.  Audited.'
      operationId: delete_watch_api_v1_autonomous_watches__watch_id__delete
      parameters:
      - in: path
        name: watch_id
        required: true
        schema:
          format: uuid
          title: Watch Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousWatchRead'
          description: Successful Response
        '401':
          description: Not authenticated
        '404':
          description: Watch not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Soft-delete an autonomous watch (returns 200 with updated entity)
      tags:
      - autonomous
    patch:
      description: 'PATCH /api/v1/autonomous/watches/{watch_id}


        Partial update — only the provided fields change (``enabled`` /

        ``playbook_id`` / ``skill_ref``). The watch''s ``knowledge_base_id``

        is immutable: a watch is bound to its KB, so retargeting to a

        different KB means creating a new watch.


        Another user''s ``watch_id`` returns 404.  Returns the updated watch

        (200).  Audited.'
      operationId: update_watch_api_v1_autonomous_watches__watch_id__patch
      parameters:
      - in: path
        name: watch_id
        required: true
        schema:
          format: uuid
          title: Watch Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutonomousWatchUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousWatchRead'
          description: Successful Response
        '401':
          description: Not authenticated
        '404':
          description: Watch or referenced project not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Partially update an autonomous watch (enable / disable / retarget)
      tags:
      - autonomous
  /api/v1/chats:
    get:
      description: Returns the caller's active chats by default. ``archived=true``
        returns archived chats only. ``project_id`` filters to chats inside a specific
        project. ``cursor`` and ``limit`` paginate; ``next_cursor`` in the response
