      description: 'Streaming multipart upload. The body is streamed to MinIO without
        ever loading the whole file into memory; a SHA-256 is computed as bytes flow
        past, and metadata is persisted with `ingestion_status=''pending''`. The document
        pipeline (Task C5) picks the row up asynchronously and flips status through
        `processing` → `ready` (or `failed`).


        Per-request size limit: `LQ_AI_MAX_UPLOAD_SIZE_MB` (default 100). Exceeding
        it returns 413 with `code=payload_too_large`.'
