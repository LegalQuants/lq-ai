      security:
      - OAuth2PasswordBearer: []
      summary: Find or create the caller's try-it sandbox matter (Wave D.2)
      tags:
      - projects
  /api/v1/projects/{project_id}:
    delete:
      description: 'Sets ``archived_at`` on the row. Hard-delete is owned by D6. Idempotent:
        a second delete on an already-archived project returns 404.'
      operationId: delete_project_api_v1_projects__project_id__delete
      parameters:
