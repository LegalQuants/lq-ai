          description: Successful Response
        '401':
          description: Not authenticated
        '404':
          description: Proposal not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Accept a proposal — append the suggested context to the Project (user-authorized
        write)
      tags:
      - autonomous
  /api/v1/autonomous/project-context-proposals/{proposal_id}/reject:
    post:
      description: 'POST /api/v1/autonomous/project-context-proposals/{proposal_id}/reject


        Sets ``state=''rejected''`` and ``rejected_at=now(UTC)``.  Does **NOT**

        touch ``projects.context_md``.


