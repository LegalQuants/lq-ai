        \ the execute endpoint):\n\n* Admins see all playbooks.\n* Non-admins see\
        \ playbooks they authored OR built-in playbooks\n  (``created_by IS NULL``\
        \ — created by the seed migration).\n\nPositions are NOT inlined in the list\
        \ response; clients fetch the\ndetail endpoint when they need them. This keeps\
