        Cheaper synchronous endpoint; no execution row is created. The

        UI calls this before showing the cost-confirmation modal.'
      properties:
        columns:
          anyOf:
          - items:
              $ref: '#/components/schemas/ColumnSpec'
            type: array
          - type: 'null'
