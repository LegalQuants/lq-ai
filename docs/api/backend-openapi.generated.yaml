          description: Optional SHA-256 hash of the deployed task-pane bundle JS.
            When present, the add-in can verify it loaded the bundle the deployment
            expects (catches Office's occasional stale-cache behavior). M3-B8 ships
            with this field nullable; M3-B7 / signing CI populates the value from
            the build manifest. Null means 'don't enforce' — not an error condition.
          title: Taskpane Bundle Hash
        taskpane_bundle_url:
          description: Canonical URL of the task-pane bundle's HTML entry point. The
            task pane reaches this from its `window.location` today; the value exists
            in the handshake so a future deployment can serve the bundle from a CDN
            or operator-chosen path without changing the manifest.
          title: Taskpane Bundle Url
          type: string
      required:
      - deployment_version
      - addin_min_compatible_version
      - addin_max_compatible_version
      - taskpane_bundle_url
      title: WordAddinVersionResponse
      type: object
    _FallbackEntry:
      description: One ``fallback`` list entry on an alias write.
      properties:
        model:
          minLength: 1
          title: Model
          type: string
        provider:
          minLength: 1
          title: Provider
          type: string
      required:
      - provider
      - model
      title: _FallbackEntry
      type: object
    app__api__projects__AttachFileRequest:
      description: '``POST /api/v1/projects/{id}/files`` body.'
      properties:
        file_id:
          format: uuid
          title: File Id
          type: string
      required:
      - file_id
      title: AttachFileRequest
      type: object
    app__schemas__knowledge__AttachFileRequest:
      additionalProperties: false
      description: '``POST /api/v1/knowledge-bases/{id}/files`` body.'
      properties:
        file_id:
          format: uuid
          title: File Id
          type: string
      required:
      - file_id
      title: AttachFileRequest
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /api/v1/auth/login
      type: oauth2
info:
  description: Backend API for the LQ.AI platform. The full surface is specified in
    docs/api/backend-openapi.yaml. M1 implementation lands progressively per docs/M1-IMPLEMENTATION-ORDER.md;
    until then, all endpoints under /api/v1 return 501 with a structured 'not implemented'
    body that names the implementing task.
  title: LQ.AI Backend API
  version: 0.7.1
openapi: 3.1.0
paths:
  /api/v1/admin/aliases:
    get:
      description: List configured aliases via the gateway's admin surface.
      operationId: list_aliases_api_v1_admin_aliases_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Aliases Api V1 Admin Aliases Get
