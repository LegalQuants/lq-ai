  /api/v1/autonomous/sessions/{session_id}/artifacts:
    get:
      description: 'GET /api/v1/autonomous/sessions/{session_id}/artifacts


        Returns the run''s persisted artifact references (the ``emit_artifact``

        chokepoint work-product, Donna ask #8) ordered by ``created_at ASC,

        id ASC``. Rows a run emits in its single executor commit typically

        share one ``created_at`` (transaction-stable ``now()``), so ``id`` is

        the deterministic tiebreaker that keeps LIMIT/OFFSET pagination

        stable — a repeatable order, NOT a guaranteed emission sequence (ids

        are random UUIDs). This differs intentionally from the newest-first

        autonomous lists: these are one run''s output, not a feed (mirrors the

        findings read above).


        Owner-gated by loading the owned session first (the artifacts table

        has no ``user_id`` — authz is via the parent session). Another user''s

        ``session_id`` — or a missing one — returns 404 (not 403) to avoid

        existence disclosure. ``limit`` is clamped to [1, 200]; ``offset`` to

        [0, ∞).


        ``document_id`` is NOT a column on ``autonomous_artifacts`` — it is

        enriched here with one batched query over the page''s non-null

        ``file_id`` values against the unique ``documents.file_id`` (1:1), so

        the UI can deep-link the KB document.


        Deletion semantics: a hard file-delete SET-NULLs ``file_id`` (the

        name/size metadata survives here; ``file_id`` and ``document_id``

        return as null). Deleting the *session* CASCADE-deletes these

        reference rows but never touches the KB document — the document

        outlives the session (it is the user''s deliverable).'
      operationId: list_session_artifacts_api_v1_autonomous_sessions__session_id__artifacts_get
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          format: uuid
          title: Session Id
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousArtifactListResponse'
          description: Successful Response
        '401':
          description: Not authenticated
        '404':
          description: Session not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List a session's persisted document-grade artifacts (work-product,
        stable order)
      tags:
      - autonomous
  /api/v1/autonomous/sessions/{session_id}/findings:
    get:
      description: 'GET /api/v1/autonomous/sessions/{session_id}/findings


        Returns the run''s persisted findings (the ``emit_finding`` chokepoint

        work-product) ordered by ``created_at ASC, id ASC``. Rows a run emits

        in its single executor commit typically share one ``created_at``

        (server-side ``now()`` is transaction-stable in Postgres), so ``id``

        is the deterministic tiebreaker that keeps LIMIT/OFFSET pagination

        stable — a repeatable order, NOT a guaranteed emission sequence (ids

        are random UUIDs). This still differs intentionally from the

        newest-first autonomous lists: these are one run''s output, not a feed.


        Owner-gated by loading the owned session first (the findings table has

        no ``user_id`` — authz is via the parent session). Another user''s

        ``session_id`` — or a missing one — returns 404 (not 403) to avoid

        existence disclosure. ``limit`` is clamped to [1, 200]; ``offset`` to

        [0, ∞).'
      operationId: list_session_findings_api_v1_autonomous_sessions__session_id__findings_get
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          format: uuid
          title: Session Id
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousFindingListResponse'
          description: Successful Response
        '401':
          description: Not authenticated
        '404':
          description: Session not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List a session's persisted findings (work-product, stable order)
      tags:
      - autonomous
  /api/v1/autonomous/sessions/{session_id}/halt:
    post:
      description: 'POST /api/v1/autonomous/sessions/{session_id}/halt


        Sets ``halt_state = ''halt_requested''`` so the next

        :func:`~app.autonomous.guard.guarded_tool_call` on the session''s

        R5 temporal brake trips and the executor transitions to ``halted``.


        **Idempotent:** if ``halt_state`` is already ``halt_requested`` or

        ``halted``, the endpoint returns the current session state with 200

        and writes NO duplicate audit row — callers may retry safely.


        Returns the updated :class:`~app.schemas.autonomous.AutonomousSessionRead`.'
      operationId: halt_session_api_v1_autonomous_sessions__session_id__halt_post
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          format: uuid
          title: Session Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousSessionRead'
          description: Successful Response
        '401':
          description: Not authenticated
        '404':
          description: Session not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Request an immediate halt for an autonomous session (idempotent)
      tags:
      - autonomous
  /api/v1/autonomous/sessions/{session_id}/ledger:
    get:
      description: 'GET /api/v1/autonomous/sessions/{session_id}/ledger


        Returns ``{chat_id, entries, gates}`` — the identical shape produced by

        the chat ``GET /{chat_id}/ledger`` endpoint — so the PR2-UI can reuse

        the chat ledger component directly without adaptation.  For a session

        ledger ``gates`` always has exactly one element (the single fiduciary-

        grade gate manufactured by ``build_session_ledger``).


        Reuses ``resolve_ledger_entries`` and ``resolve_gates`` — the same

        functions the chat ledger endpoint calls.


        Owner-gated via ``_load_session_for_reader``; a non-privileged non-owner''s

        ``session_id`` or a missing session returns 404 (not 403) to avoid

        existence disclosure. A privileged reader (admin/auditor) may read

        another user''s session ledger; that cross-user read writes one

        ``auditor_audit`` row (``session_ledger_viewed``). Returns 404 if the

        session exists but ``build_session_ledger`` has not been called yet

        (no hidden chat manufactured).'
      operationId: get_session_ledger_api_v1_autonomous_sessions__session_id__ledger_get
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          format: uuid
          title: Session Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Session Ledger Api V1 Autonomous Sessions  Session
                  Id  Ledger Get
                type: object
          description: Successful Response
        '401':
          description: Not authenticated
        '404':
          description: Session not found or has no ledger
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Citation ledger + fiduciary gate for an autonomous session (WS-D PR2
        C5)
      tags:
      - autonomous
  /api/v1/autonomous/watches:
    get:
      description: 'GET /api/v1/autonomous/watches


        Returns the caller''s non-deleted watches ordered by

        ``created_at DESC``.  Pass ``?enabled=true|false`` and/or

        ``?knowledge_base_id=`` to filter; omitting them returns all

        non-deleted watches.  ``limit`` is clamped to [1, 200]; ``offset`` to

        [0, ∞).'
      operationId: list_watches_api_v1_autonomous_watches_get
      parameters:
      - in: query
        name: enabled
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
      - in: query
        name: knowledge_base_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Knowledge Base Id
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousWatchListResponse'
          description: Successful Response
        '401':
