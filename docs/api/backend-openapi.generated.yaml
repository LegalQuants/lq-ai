      - OAuth2PasswordBearer: []
      summary: List Aliases
      tags:
      - admin
    post:
      description: Create a new alias. 409 propagates from the gateway.
      operationId: create_alias_api_v1_admin_aliases_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Create Alias Api V1 Admin Aliases Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Alias
      tags:
      - admin
  /api/v1/admin/aliases/{name}:
    delete:
      description: Remove an alias. 404 propagates from the gateway.
      operationId: remove_alias_api_v1_admin_aliases__name__delete
