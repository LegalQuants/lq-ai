          title: Name
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Update Alias Api V1 Admin Aliases  Name  Patch
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update Alias
      tags:
      - admin
  /api/v1/admin/audit-log:
    get:
      description: 'GET /api/v1/admin/audit-log — admin-only read of the audit log.


        Filters compose with AND. The result is ordered by

        ``timestamp DESC`` (most recent first). Pagination is cursor-based

        against the timestamp+id pair, so concurrent inserts during a

        paginated walk don''t shift the page boundaries.


        Privilege filter semantics: ``privilege_marked=true`` returns only

        privileged-project rows (per PRD §3.11 / D3 verification step);

        ``privilege_marked=false`` returns only non-privileged rows; omitting

        the parameter returns both.'
      operationId: get_audit_log_api_v1_admin_audit_log_get
      parameters:
      - description: Filter to entries with the given privilege flag. Omit to return
          both privileged and non-privileged rows.
        in: query
        name: privilege_marked
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter to entries with the given privilege flag. Omit to return
            both privileged and non-privileged rows.
          title: Privilege Marked
      - description: Filter to entries with the given routed inference tier (1-5).
          Omit to return all tiers (and non-inference entries).
        in: query
        name: routed_inference_tier
        required: false
        schema:
          anyOf:
          - maximum: 5
            minimum: 1
            type: integer
          - type: 'null'
          description: Filter to entries with the given routed inference tier (1-5).
            Omit to return all tiers (and non-inference entries).
          title: Routed Inference Tier
      - description: Exact-match filter on ``action`` (e.g., ``chat.message_sent``).
        in: query
        name: action
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exact-match filter on ``action`` (e.g., ``chat.message_sent``).
          title: Action
      - description: Filter to entries authored by the given user (UUID string).
        in: query
        name: user_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter to entries authored by the given user (UUID string).
          title: User Id
      - description: ISO-8601 timestamp; only entries at or after this time.
        in: query
        name: since
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: ISO-8601 timestamp; only entries at or after this time.
          title: Since
      - description: ISO-8601 timestamp; only entries at or before this time.
        in: query
        name: until
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: ISO-8601 timestamp; only entries at or before this time.
          title: Until
      - description: Page size (1-500).
        in: query
        name: limit
        required: false
        schema:
          default: 50
          description: Page size (1-500).
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - description: Opaque pagination cursor (the previous page's ``next_cursor``).
          Omit on the first page.
        in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque pagination cursor (the previous page's ``next_cursor``).
            Omit on the first page.
          title: Cursor
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List audit-log entries with privilege / tier filters (D3)
      tags:
      - admin
  /api/v1/admin/bootstrap-status:
    get:
      description: Unauthenticated probe used by the login UI to render fresh-install
        hints.
      operationId: get_bootstrap_status_api_v1_admin_bootstrap_status_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatus'
          description: Successful Response
      summary: Report whether the first-run bootstrap admin password is still active.
      tags:
      - admin
  /api/v1/admin/config:
    get:
      description: Return the gateway's sanitized current config (D0.5).
      operationId: get_admin_config_api_v1_admin_config_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Admin Config Api V1 Admin Config Get
                type: object
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Get Admin Config
      tags:
      - admin
  /api/v1/admin/ingest-health:
    get:
      description: 'GET /api/v1/admin/ingest-health — aggregate ingest-status counts
        (admin-only).


        The endpoint is read-only and stateless. Two queries: one grouped

        aggregate over ``documents.ingest_status``, one filtered count over

        ``files.ingestion_status``. Soft-deleted rows are excluded from

        both (the operator is asking about the live deployment surface, not

        historical state).'
      operationId: get_ingest_health_api_v1_admin_ingest_health_get
      responses:
