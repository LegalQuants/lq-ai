  /api/v1/skills:
    get:
      description: "Return summaries for skills visible to the caller.\n\nMerging\
        \ semantics (per ADR 0012):\n\n* ``scope=all`` (default) — caller's user-scope\
        \ rows first, then\n  built-ins. Dedup on slug: a user shadow hides the built-in\
        \ of\n  the same slug from this listing.\n* ``scope=user`` — caller's user-scope\
        \ rows only.\n* ``scope=builtin`` — filesystem built-ins only (no shadow merge).\n\
        * ``scope=team`` — empty list until D8.1 (team scope deferred).\n\nThe ``tag``\
        \ filter applies to both layers; a built-in matches if\nits ``lq_ai.tags``\
        \ contains the tag, a user shadow matches if its\n``tags`` column contains\
        \ it."
      operationId: list_skills_api_v1_skills_get
      parameters:
      - in: query
        name: scope
        required: false
        schema:
          default: all
          pattern: ^(builtin|user|team|all)$
          title: Scope
          type: string
      - in: query
        name: tag
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List Skills
      tags:
      - skills
  /api/v1/skills/autocomplete:
    get:
      description: "Typeahead for the chat composer's skill picker.\n\nTwo modes:\n\
        \n* **Empty ``q``** — return the caller's most-recently-used skills\n  (by\
        \ ``messages.applied_skills``), capped at ``limit``. If the user\n  has fewer\
        \ recents than ``limit``, fill the tail with the\n  alphabetical merged catalog\
        \ (skipping anything already in the\n  recents block). Brand-new users with\
        \ no chat activity see the\n  alphabetical fallback exclusively.\n* **Non-empty\
        \ ``q``** — rank the merged catalog by the three signals\n  in ``_rank_autocomplete_match``\
        \ (slash-alias prefix > slug prefix\n  > title substring) and return up to\
        \ ``limit`` non-zero matches.\n\nShadowing: a user-scope row at the same slug\
        \ as a built-in hides the\nbuilt-in from results (ADR 0012). The ``scope``\
        \ field on each result\nlets the UI render the right affordance.\n\nBounds:\
        \ ``limit`` is hard-clamped via FastAPI's ``Query(ge=1, le=25)``\n— a request\
        \ for ``limit=50`` returns 422 rather than silently\ntruncating, which keeps\
        \ the contract explicit for the frontend."
      operationId: autocomplete_skills_api_v1_skills_autocomplete_get
      parameters:
      - description: Substring to match. Empty = recents.
        in: query
        name: q
        required: false
        schema:
          default: ''
          description: Substring to match. Empty = recents.
          title: Q
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 10
          maximum: 25
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillAutocompleteResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Autocomplete skills by /alias / slug / title (Wave D.2)
      tags:
      - skills
  /api/v1/skills/{skill_name}:
    get:
      description: "Return full skill detail using the D8.1b resolution stack.\n\n\
        Resolution order (per ADR 0012 + D8.1b):\n\n1. The caller's non-archived user-scope\
        \ shadow at this slug.\n2. The newest non-archived team-scope shadow at this\
        \ slug owned\n   by any team the caller is a member of.\n3. The filesystem-canonical\
        \ built-in.\n\n404 if none of the three match. Member-of-team is sufficient\
        \ for\nread; mutate rights stay admin-only at the management endpoints."
      operationId: get_skill_api_v1_skills__skill_name__get
      parameters:
      - in: path
        name: skill_name
        required: true
        schema:
          title: Skill Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Skill
      tags:
      - skills
  /api/v1/skills/{skill_name}/contents:
    get:
      description: 'Return the full skill payload — SKILL.md + reference + example
        files.


        Same shape as ``GET /skills/{skill_name}`` (the user-facing read

        endpoint). PRD §3.4 names this endpoint explicitly as the contract

        the "view this skill" affordance + the skill inspector side panel

        target; exposing it under a distinct URL lets the frontend use URL

        semantics ("/contents") to signal inspection intent, even though

        the response body is the same as the base GET. Applies the same

        D8.1b resolution stack (user > team > built-in).'
      operationId: get_skill_contents_api_v1_skills__skill_name__contents_get
      parameters:
      - in: path
        name: skill_name
        required: true
        schema:
          title: Skill Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Full skill contents for the skill inspector (PRD §3.4)
      tags:
      - skills
  /api/v1/skills/{skill_name}/fork:
    post:
      description: 'Fork a filesystem-canonical built-in into a new user-scope row.


        Mirrors the OpenAPI sketch''s contract (``new_name`` + ``scope`` in

        the body). D8 only implements ``scope=''user''``; ``scope=''team''`` is

        rejected with a 400 pointing at D8.1.


        If ``new_name`` matches an existing user-scope slug for this user,

        409. If ``new_name`` is omitted or equals the source slug, the new

        row becomes a same-slug shadow — which is the expected "I want my

        own version of nda-review" UX.


        Unknown body fields (e.g., ``{"name": "..."}`` instead of

        ``{"new_name": "..."}``) are rejected with a 422 rather than

        silently dropped — see :class:`SkillForkBody`.'
      operationId: fork_skill_api_v1_skills__skill_name__fork_post
      parameters:
      - in: path
        name: skill_name
        required: true
        schema:
          title: Skill Name
          type: string
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/SkillForkBody'
              - type: 'null'
              title: Payload
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Fork Skill
      tags:
      - skills
  /api/v1/skills/{skill_name}/inputs:
    get:
      description: 'Return the skill''s declared inputs (required + optional).


        The PRD §3.4 skill-input-form pattern: skills declare inputs in

        their frontmatter so the UI can render a structured form rather

        than letting the model ask for missing context conversationally.

        Used by Enhance Prompt''s "missing required input" surface and by

        any skill author who wants their skill to feel form-driven.


        Resolution mirrors ``GET /skills/{name}``: user > team > built-in.

        For user/team-scope rows the inputs live in ``frontmatter_extra``

        (under either the top-level ``inputs`` key or ``lq_ai.inputs``);

        for built-ins they ride the parsed SkillFrontmatter. Returns an

        empty (name-only) shape when the skill declares no inputs.'
      operationId: get_skill_inputs_api_v1_skills__skill_name__inputs_get
      parameters:
      - in: path
        name: skill_name
        required: true
        schema:
          title: Skill Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillInputs'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Declared inputs (form schema) for the skill-input-form pattern
      tags:
      - skills
  /api/v1/tabular/execute:
    post:
      description: 'Kick off a tabular execution against the supplied document corpus.


        Authorization: the caller must own every document in

        ``document_ids``. Cross-user or non-existent ids collapse into a

        single 404 (no information leakage), matching the M3-A6 Easy

        Playbook posture.


        Creates a :class:`TabularExecution` row at ``status=''pending''``

        and enqueues the ARQ worker job on the shared playbook queue

        (per Decision C-3). Returns 202 immediately with the row; the

        result-view polls

        ``GET /api/v1/tabular/executions/{id}`` until status reaches

        a terminal state.


        Per the M3-C2 quality bar, "execution completed" does NOT mean

        every cell is correct — the result-view''s per-cell citation

        drawer is where the user-attorney validates extractions before

        relying on them.'
      operationId: create_tabular_execution_api_v1_tabular_execute_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TabularExecutionCreate'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TabularExecutionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Start a tabular execution.
      tags:
      - tabular
  /api/v1/tabular/executions:
    get:
      description: 'Return the caller''s tabular executions, recent-first, soft-deleted
        excluded.


        Admins see all executions; non-admins see only their own

        (matches the Easy Playbook list posture).'
      operationId: list_tabular_executions_api_v1_tabular_executions_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TabularExecutionSummary'
                title: Response List Tabular Executions Api V1 Tabular Executions
                  Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List the caller's tabular executions.
      tags:
      - tabular
  /api/v1/tabular/executions/{execution_id}:
    delete:
      description: Soft-delete (sets ``deleted_at``). Already-deleted rows return
        404.
      operationId: delete_tabular_execution_api_v1_tabular_executions__execution_id__delete
      parameters:
      - in: path
        name: execution_id
        required: true
        schema:
          format: uuid
          title: Execution Id
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Soft-delete a tabular execution.
      tags:
      - tabular
    get:
      description: 'Return one tabular execution — full state + grid results.


        Authorization: caller must be the row''s ``user_id`` OR an admin.

        Cross-user / missing / soft-deleted rows collapse into 404.


        Citations (DE-309): when the execution has minted

        ``tabular_cell_citations`` rows, every cell''s ``citations`` list is

        rebuilt from those rows — real ``citation_id``s plus chunk-local

        char offsets; cells the locator could not ground get an EMPTY list

        (fail-closed: they render unverified). Executions predating

        migration 0066 have no minted rows and keep the legacy uuid5-bridge

        citations synthesized by the schema validator. The presence check is

        per execution (one indexed query), not per cell.'
      operationId: get_tabular_execution_api_v1_tabular_executions__execution_id__get
      parameters:
      - in: path
        name: execution_id
        required: true
        schema:
          format: uuid
          title: Execution Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TabularExecutionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get a tabular execution by id.
      tags:
      - tabular
  /api/v1/tabular/executions/{execution_id}/cancel:
    post:
      description: 'Set status to ``cancelled``.


        The worker''s per-cell loop checks the row status at each cell

        boundary; on cancellation it stops accepting new cells and the

        aggregate node writes whatever partial results landed. Already-

        terminal rows (``completed`` / ``failed`` / ``cancelled``) are

        a 409 — operators wanting a clean re-run start a new execution

        via ``POST /tabular/execute``.'
      operationId: cancel_tabular_execution_api_v1_tabular_executions__execution_id__cancel_post
      parameters:
      - in: path
        name: execution_id
        required: true
        schema:
          format: uuid
          title: Execution Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TabularExecutionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Cancel a pending or running tabular execution.
      tags:
      - tabular
  /api/v1/tabular/executions/{execution_id}/export:
    get:
      description: "Stream the tabular grid in XLSX or CSV.\n\nBoth formats include\
        \ the document column (leftmost) plus one column\nper declared column spec,\
        \ in spec order. Cells with\n``confidence='failed'`` render as ``\"(failed)\"\
        `` rather than an\nempty string so operators can spot the gap without cross-referencing\n\
        the source execution.\n\nCitation surfacing differs by format:\n\n* **XLSX**\
        \ — each grid cell with at least one citation carries an\n  openpyxl ``Comment``\
        \ listing the citation IDs and confidences.\n  Operators can hover any cell\
        \ in Excel / Numbers / Google Sheets\n  to see the source. (Up to 5 citations\
        \ per comment; the cell\n  retains the full count.)\n* **CSV** — a trailing\
        \ ``citation_links`` column per row carries a\n  semicolon-separated list\
        \ of ``\"<column_name>:<citation_id>\"``\n  pairs across every cell in the\
        \ row. Empty when no cell in the\n  row had citations.\n\nThe execution must\
        \ be in ``status='completed'``. Pending / running\n/ cancelled / failed rows\
        \ return 409 — partial grids would mislead\ndownstream consumers. (DE-XXX\
        \ candidate: a separate\n``allow_partial=true`` query param to export partial\
        \ grids with a\nvisible watermark; deferred until an operator surfaces the\
        \ need.)"
      operationId: export_tabular_execution_api_v1_tabular_executions__execution_id__export_get
      parameters:
      - in: path
        name: execution_id
        required: true
        schema:
          format: uuid
          title: Execution Id
          type: string
      - description: Export format. `xlsx` carries citations as cell comments; `csv`
          flattens citations into a `citation_links` column.
        in: query
        name: format
        required: false
        schema:
          default: xlsx
          description: Export format. `xlsx` carries citations as cell comments; `csv`
            flattens citations into a `citation_links` column.
          enum:
          - xlsx
          - csv
          title: Format
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
            text/csv: {}
          description: Streaming export — Content-Type matches format.
        '409':
          description: Execution not in terminal status — cannot export.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Export a completed tabular execution as XLSX or CSV.
      tags:
      - tabular
  /api/v1/tabular/preview-cost:
    post:
      description: 'Synchronous cost preview — no execution row is created.


        The UI calls this before showing the confirmation modal so the

        operator sees the cell-count + estimated cost + per-tier

        breakdown (Decision C-5). The estimator''s rolling average

        (M2-E2 pattern) caches per ~5 minutes in-process; rapid re-previews

        during column-spec editing don''t thrash the DB.


        Ensemble columns preview higher (Donna #6): the estimator adds one

        ensemble-pass cost (N judge calls) per ensemble cell. We fetch the

        gateway''s resolved ensemble config so the premium reflects the

        deployment''s actual judge models + default; the config is

        process-cached and ``get_citation_engine_ensemble_config`` already

        returns ``None`` on any gateway error / unreachable, so an

        unconfigured or down gateway simply yields no premium (graceful

        degrade — the preview stays a non-fatal pre-flight).


        Authorization is the router-level ``get_active_user`` gate — any

        authenticated caller may preview costs against their own document

        selection. The document-ownership check is enforced at execute

        time; preview doesn''t load the documents.'
      operationId: preview_tabular_cost_api_v1_tabular_preview_cost_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TabularPreviewCostRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TabularPreviewCostResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Preview the cost of a proposed tabular execution.
      tags:
      - tabular
  /api/v1/teams:
    get:
      description: 'GET /api/v1/teams — caller''s teams with ``caller_role`` populated.


        Optional ``role`` filter (D8.1c) restricts to memberships of a

        specific role. The UI uses ``?role=admin`` for the team-scope

        skill creation picker so only teams the caller can mutate render.'
      operationId: list_my_teams_api_v1_teams_get
      parameters:
      - in: query
        name: role
        required: false
        schema:
          anyOf:
          - pattern: ^(admin|member)$
            type: string
          - type: 'null'
          title: Role
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TeamSummary'
                title: Response List My Teams Api V1 Teams Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List teams the caller belongs to (newest first)
      tags:
      - teams
  /api/v1/teams/{team_id}:
    get:
      operationId: get_my_team_api_v1_teams__team_id__get
      parameters:
      - in: path
        name: team_id
        required: true
        schema:
          format: uuid
          title: Team Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
          description: Successful Response
        '404':
          description: Team does not exist OR you are not a member
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Fetch a team the caller belongs to (with roster)
      tags:
      - teams
  /api/v1/user-skills:
    get:
      description: "GET /api/v1/user-skills — non-archived rows the caller can edit.\n\
        \nScope filter (D8.1c — defaults to ``user`` for back-compat):\n\n* ``user``\
        \ — the caller's user-scope rows only (the D8 behavior).\n* ``team`` — team-scope\
        \ rows from any team where the caller is an\n  admin. Members can read team\
        \ skills in the chat picker but can't\n  mutate, so the management list returns\
        \ admin-only rows.\n* ``all`` — both, sorted together by ``updated_at DESC,\
        \ id DESC``.\n\nSort: ``updated_at DESC`` then ``id DESC`` for deterministic\
        \ tie-\nbreaking (mirrors the saved_prompts convention)."
      operationId: list_user_skills_api_v1_user_skills_get
      parameters:
      - in: query
        name: scope
        required: false
        schema:
          default: user
          pattern: ^(user|team|all)$
          title: Scope
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserSkillResponse'
                title: Response List User Skills Api V1 User Skills Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List the caller's editable skills (user-scope by default; team-scope
        via ?scope)
      tags:
      - user-skills
    post:
      description: "POST /api/v1/user-skills — create a fresh user- or team-scope\
        \ skill.\n\nScope branches:\n\n* ``scope='user'`` (default) — owned by the\
        \ caller. Slug collision with\n  a filesystem built-in is **allowed** (the\
        \ shadow case per ADR 0012).\n  Slug collision with the caller's own non-archived\
        \ user-scope skills\n  returns 409.\n* ``scope='team'`` — owned by ``owner_team_id``.\
        \ Caller must be a\n  team-admin member of that team or 404 (id-probing-safe\
        \ — same\n  privacy posture as cross-user reads). Slug collision within the\n\
        \  team's non-archived rows returns 409. Slug collision with a\n  built-in\
        \ OR with any user-scope row is permitted (shadowing semantics\n  cascade\
        \ per D8.1b resolver: user > team > built-in).\n\n422 fires when ``scope``\
        \ and ``owner_team_id`` are inconsistent\n(team scope missing the team id,\
        \ user scope carrying a team id)."
      operationId: create_user_skill_api_v1_user_skills_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSkillCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSkillResponse'
          description: Successful Response
        '404':
          description: Team referenced by owner_team_id not found
        '409':
          description: Slug already exists in this scope
        '422':
          description: scope / owner_team_id combination invalid
      security:
      - OAuth2PasswordBearer: []
      summary: Create a new user- or team-scope skill
      tags:
      - user-skills
  /api/v1/user-skills/{skill_id}:
    delete:
      description: 'DELETE /api/v1/user-skills/{id} — soft-delete via ``archived_at``.


        Archived rows free the slug for a new user skill at the same slug.

        The audit log preserves the row''s identity so deletion is traceable

        even after the slug has been reused.'
      operationId: delete_user_skill_api_v1_user_skills__skill_id__delete
      parameters:
      - in: path
        name: skill_id
        required: true
        schema:
          format: uuid
          title: Skill Id
          type: string
      responses:
        '204':
          description: Successful Response
        '404':
          description: User skill not found
        '410':
          description: User skill is already archived
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Soft-delete a user-scope skill (owner-only)
      tags:
      - user-skills
    get:
      description: 'Owner-only for user-scope; team-admin-only for team-scope rows.


        Non-admin team members read team skills through the merged picker

        (``GET /api/v1/skills/{slug}``), not through this management

        endpoint — same posture as filesystem built-ins.'
      operationId: get_user_skill_api_v1_user_skills__skill_id__get
      parameters:
      - in: path
        name: skill_id
        required: true
        schema:
          format: uuid
          title: Skill Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSkillResponse'
          description: Successful Response
        '404':
          description: User skill not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Fetch a single user/team-scope skill (owner or team-admin)
      tags:
      - user-skills
    patch:
      description: 'PATCH /api/v1/user-skills/{id} — partial update.


        The audit row''s ``details.version_before`` / ``version_after`` make

        the *fact* of edits forensically traceable per ADR 0012 §5; the

        *content* of prior versions is not preserved (no history table in

        D8). An idempotent PATCH with no actual changes returns the current

        row without writing an audit row.'
      operationId: update_user_skill_api_v1_user_skills__skill_id__patch
      parameters:
      - in: path
        name: skill_id
        required: true
        schema:
          format: uuid
          title: Skill Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSkillUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSkillResponse'
          description: Successful Response
        '404':
          description: User skill not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update a user-scope skill (partial; owner-only)
      tags:
      - user-skills
  /api/v1/user-skills/{skill_id}/versions:
    get:
      description: 'GET /api/v1/user-skills/{id}/versions — most-recent-first audit
        feed.


        Returns the ``audit_log`` rows for ``resource_type=''user_skill''``

        keyed by this skill id. ``user_skill.created`` lands last in the

        list because the result is ordered ``timestamp DESC`` — the timeline

        UI renders top-down, newest at the top.


        Access posture mirrors the mutable surface: user-scope rows are

        visible only to the owner; team-scope rows only to team-admins.

        Non-admin team members read the merged skill via ``GET /skills/{slug}``

        but the audit feed is part of the management surface, not the

        consumption surface, so the read gate is the mutate gate. 404 for

        "no such id" and "exists but not yours" alike (id-probing-safe;

        matches the load-mutable convention elsewhere in this router).


        ``include_archived=True`` because a freshly-archived skill''s

        timeline still needs to render for the management UI; ``_load_mutable``

        handles the auth check uniformly across active and archived rows.'
      operationId: list_user_skill_versions_api_v1_user_skills__skill_id__versions_get
      parameters:
      - in: path
        name: skill_id
        required: true
        schema:
          format: uuid
          title: Skill Id
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSkillVersionsResponse'
          description: Successful Response
        '404':
          description: User skill not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Audit-log view of edits for this user-skill (Wave D.2)
      tags:
      - user-skills
  /api/v1/users/me:
    get:
      description: 'GET /api/v1/users/me — return the calling user''s public profile.


        Reachable while `must_change_password=true` so the client can read the

        flag and route to the change-password flow. Other authenticated

        endpoints are gated until the user clears it.'
      operationId: get_me_api_v1_users_me_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Get current user
      tags:
      - users
    patch:
      description: 'PATCH /api/v1/users/me — edit the caller''s own profile.


        Caller-scoped: mutates only the authenticated user''s own row; no user

        id is ever accepted from the path or body. Currently updates

        ``display_name`` only (trimmed, non-empty, length-guarded by

        ``UserProfileUpdate``). Email self-service editing is intentionally

        out of scope (re-verification / MFA / uniqueness).


        Writes a ``user.profile_updated`` audit row enumerating the changed

        fields, mirroring ``patch_me_preferences``. Returns the updated

        ``UserPublic`` — the same shape ``GET /users/me`` returns.'
      operationId: patch_me_api_v1_users_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update the calling user's own profile (display_name)
      tags:
      - users
  /api/v1/users/me/delete:
    post:
      description: "POST /api/v1/users/me/delete — soft-schedule with a grace period.\n\
        \nIdempotent: if the user already has a pending deletion the existing\nschedule\
        \ is returned. This prevents accidental \"extension\" of the\ngrace period\
        \ via repeated calls.\n\nSide-effects:\n\n1. ``deletion_scheduled_at = now()\
        \ + gdpr_grace_period_days``.\n2. All of the user's active ``user_sessions``\
        \ are revoked. The user\n   can still log in during the grace period (to call\
        \ cancel) — the\n   gate is on ``deleted_at``, not ``deletion_scheduled_at``.\n\
        3. An ``audit_log`` row records the request.\n\nLogin during the grace period\
        \ is preserved so the user retains the\nability to cancel; hard delete itself\
        \ runs in the daily worker\ncron."
      operationId: delete_me_api_v1_users_me_delete_post
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteScheduledResponse'
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Schedule account deletion (GDPR Article 17)
      tags:
      - users
  /api/v1/users/me/delete/cancel:
    post:
      description: 'POST /api/v1/users/me/delete/cancel — clear a pending schedule.


        Returns 400 if there is no pending deletion. The grace-period

        window itself is the only valid cancel surface — once the worker

        has hard-deleted the user, there is no row to recover.'
      operationId: cancel_delete_me_api_v1_users_me_delete_cancel_post
      responses:
        '204':
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Cancel a pending account deletion
      tags:
      - users
  /api/v1/users/me/export:
    post:
      description: 'POST /api/v1/users/me/export — async; returns a job id for polling.


        Inserts a `user_export_jobs` row with status=''queued'', enqueues the

        arq worker job, and returns 202. The worker runs the ZIP build +

        MinIO upload out-of-band.


        Re-calling while a queued/processing job exists is allowed —

        operators may want a fresh export after deleting some content.

        The two jobs run independently.'
      operationId: export_me_api_v1_users_me_export_post
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Queue a per-user data export
      tags:
      - users
  /api/v1/users/me/export/{job_id}:
    get:
      description: 'GET /api/v1/users/me/export/{job_id}.


        Returns 404 if the job doesn''t exist or belongs to another user

        (don''t leak existence cross-user). On a completed job, returns a

        presigned download URL valid for 24h. On a job whose bundle has

        expired (storage_key cleared by the GC cron), the response carries

        no URL and the status remains ''completed'' for audit clarity — the

        caller can re-request export to get a fresh bundle.'
      operationId: get_export_job_api_v1_users_me_export__job_id__get
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Poll a user-export job
      tags:
      - users
  /api/v1/users/me/preferences:
    get:
      description: 'GET /api/v1/users/me/preferences — preferences slice of the profile.


        Returns the same data ``GET /users/me`` does for the preferences

        fields; this dedicated endpoint exists so frontends can subscribe

        to preferences changes without re-fetching the whole user object.'
      operationId: get_me_preferences_api_v1_users_me_preferences_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: 'Read the calling user''s preferences (Wave A: reasoning_visibility)'
      tags:
      - users
    patch:
      description: 'PATCH /api/v1/users/me/preferences — partial update.


        Only the fields the user actually supplies move. An idempotent

        PATCH (same value re-supplied) returns 200 without writing an

        audit row, matching the user_skills / saved_prompts pattern.

        Writes ``user.preferences_updated`` audit rows when anything

        actually changes, with details enumerating the changed fields and

        before/after values (so a privacy audit can reconstruct the

        preference history).'
      operationId: patch_me_preferences_api_v1_users_me_preferences_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferencesUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update the calling user's preferences (partial)
      tags:
      - users
  /api/v1/word-addin/version:
    get:
      description: Unauthenticated endpoint the task pane consults on mount. Returns
        the deployment's version + the add-in version range this deployment is compatible
        with. The task pane compares its bundled version (baked in by webpack at build
        time) to the range; out-of-range bundles surface an 'Update needed' overlay
        rather than getting stuck against a breaking-change API call.
      operationId: get_version_api_v1_word_addin_version_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WordAddinVersionResponse'
          description: Successful Response
      summary: Version handshake for the Word add-in task pane (M3-B8).
      tags:
      - word-addin
  /health:
    get:
      description: 'Liveness probe — returns 200 as soon as the process is serving
        requests.


        Per K8s liveness convention: this answers "is the process alive?" and is

        independent of whether downstream dependencies are reachable. Used by

        docker-compose healthchecks and orchestration platforms.'
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
      tags:
      - meta
  /ready:
    get:
      description: 'Readiness probe — returns 200 when DB + Redis + MinIO + gateway
        are reachable.


        Per K8s readiness convention: this answers "can I serve user requests?"

        Returns 200 with per-dependency `ok: true` when everything is up.

        Returns 503 with per-dependency status (and `ok: false` for failed

        deps) when any dependency is unreachable. Liveness (`/health`) stays

        200 in either case so orchestrators don''t kill the pod for a transient

        dependency outage.'
      operationId: ready_ready_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Ready
      tags:
      - meta
