    IngestHealthResponse:
      description: 'Aggregate ingest-status counts across the deployment.


        The four document-level buckets sum to roughly the document count

        (rows in ``documents``); ``parse_failed`` reports file-level

        failures (rows in ``files`` with ``ingestion_status=''failed''``),

        which never reach the ``documents`` table.


        Operators use this surface as the canonical "is my ingest healthy?"

        signal — a non-zero ``embed_failed`` or ``partial`` count is the

        silent-degrade signal that triggered DE-276; a non-zero

        ``parse_failed`` count is the operator''s cue to inspect specific

        files via the existing file-list UI.'
      properties:
        embed_failed:
          description: Documents whose embed worker raised before any chunk was embedded
            — hybrid retrieval degrades to FTS-only for these.
          title: Embed Failed
          type: integer
        ok:
          description: Documents with all chunks successfully embedded.
          title: Ok
          type: integer
        parse_failed:
          description: Files that failed at parse time and never produced a documents
            row (``files.ingestion_status='failed'``).
          title: Parse Failed
          type: integer
        partial:
          description: Documents whose embed worker raised mid-batch — some chunks
            have vectors, others are NULL. Operators may re-run ingest to recover.
          title: Partial
          type: integer
        total_documents:
          description: Total rows in the documents table (sum of ok + embed_failed
            + partial).
          title: Total Documents
          type: integer
      required:
      - ok
      - embed_failed
      - partial
      - parse_failed
      - total_documents
      title: IngestHealthResponse
      type: object
