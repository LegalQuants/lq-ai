        ``receipts_viewed``) rather than delegating to the read handler.'
      operationId: export_chat_receipts_api_v1_chats__chat_id__receipts_export_jsonl_get
      parameters:
      - in: path
        name: chat_id
        required: true
        schema:
          format: uuid
          title: Chat Id
          type: string
      - in: query
        name: event_kinds
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Kinds
      responses:
        '200':
          description: Successful Response
        '422':
          content:
