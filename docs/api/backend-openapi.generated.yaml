          title: Name
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Remove Alias
      tags:
      - admin
    get:
      description: Return a single alias. 404 propagates from the gateway.
      operationId: get_alias_api_v1_admin_aliases__name__get
      parameters:
