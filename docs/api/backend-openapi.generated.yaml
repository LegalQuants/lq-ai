              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create a new playbook.
      tags:
      - playbooks
  /api/v1/playbooks/easy:
    post:
      description: 'Kick off an Easy Playbook generation against the supplied document
        corpus.


        Authorization: the caller must own every document in

        ``document_ids``. Cross-user or non-existent ids collapse into a

        single 404 (no information leakage), matching the M3-A2 executor''s

        posture.


        Creates an :class:`EasyPlaybookGeneration` row at

        ``status=''pending''`` and enqueues the ARQ worker job on the

        ``arq:m3a6`` queue. Returns 202 immediately with the row id; the

        wizard''s Step 2 polls

        ``GET /api/v1/playbooks/easy/{generation_id}`` until status

        reaches ``completed`` or ``error``.


        Per the M3-A6 quality bar, "generation completed" does NOT mean

        the playbook is fit for use — the wizard''s Step 3 inline editor

        is where the user-attorney validates and edits before the final

        save (which POSTs to ``/api/v1/playbooks`` like any other

        playbook create).'
      operationId: create_easy_playbook_generation_api_v1_playbooks_easy_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EasyPlaybookGenerationCreate'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EasyPlaybookGeneration'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Start an Easy Playbook generation run.
      tags:
      - playbooks
  /api/v1/playbooks/easy/{generation_id}:
    get:
      description: 'Return the current state of one Easy Playbook generation.


        Caller must be the row''s ``user_id`` OR an admin. Cross-user /

        missing rows collapse into 404. The wizard''s Step 2 polls this

        endpoint every few seconds until ``status`` reaches a terminal

        state (``completed`` or ``error``).'
      operationId: get_easy_playbook_generation_api_v1_playbooks_easy__generation_id__get
      parameters:
      - in: path
        name: generation_id
        required: true
        schema:
          format: uuid
          title: Generation Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EasyPlaybookGeneration'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Poll an Easy Playbook generation row.
      tags:
      - playbooks
  /api/v1/playbooks/{playbook_id}:
    delete:
      description: "Soft-delete the playbook by setting ``deleted_at`` — M3-A6 Phase\
        \ 2.\n\nAuthorization mirrors :func:`update_playbook`:\n\n* Built-ins are\
        \ immutable (403) — operators fork built-ins; they do\n  not delete them.\n\
        * Non-admin callers must own the playbook (404 otherwise).\n* Already soft-deleted\
        \ rows return 404 (the row is invisible to all\n  callers via :func:`_load_visible_playbook`).\n\
        \nThe ``playbook_positions`` rows are NOT deleted; they continue to\nreference\
        \ the now-soft-deleted playbook. This preserves the\nrelationship for any\
        \ historical ``playbook_executions`` that\nreferenced positions by id. A future\
        \ hard-purge sweep can drop both\npositions and the tombstone playbook together."
      operationId: delete_playbook_api_v1_playbooks__playbook_id__delete
      parameters:
      - in: path
        name: playbook_id
        required: true
        schema:
          format: uuid
          title: Playbook Id
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Soft-delete a playbook.
      tags:
      - playbooks
    get:
      description: 'Return the playbook header + positions + fallback tiers.


        Visibility: admins see all; non-admins see playbooks they authored

        or built-in playbooks (``created_by IS NULL``). 404 (not 403) on

        unauthorized access — mirrors the playbook-execute handler.'
      operationId: get_playbook_api_v1_playbooks__playbook_id__get
      parameters:
      - in: path
        name: playbook_id
        required: true
        schema:
          format: uuid
          title: Playbook Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playbook'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get a playbook with its full position list.
      tags:
      - playbooks
    patch:
      description: 'Patch the playbook header; atomically replace positions if supplied
        — M3-A6 Phase 2.


        Authorization: built-in playbooks (``created_by IS NULL``) are

        immutable through this endpoint by anyone, including admins —

        operators ship built-ins via migration and the admin-fork-then-edit

        path is the canonical mutation route. Non-built-in playbooks can be

        edited by their author OR by an admin. Cross-user / soft-deleted

        cases return 404 (no information leakage), matching the read paths.


        Position replacement is atomic: when ``body.positions`` is supplied,

        every existing position row for this playbook is deleted and the

        body''s list is inserted in a single transaction. To leave positions

        alone, omit the field (``None``); to clear all positions, send an

        empty list ``[]``.'
      operationId: update_playbook_api_v1_playbooks__playbook_id__patch
      parameters:
      - in: path
        name: playbook_id
        required: true
        schema:
          format: uuid
          title: Playbook Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybookUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playbook'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update a playbook's header and (optionally) replace its positions.
      tags:
      - playbooks
  /api/v1/playbooks/{playbook_id}/execute:
