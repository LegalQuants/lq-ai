components:
  schemas:
    AdminUserListResponse:
      description: Paginated user list for ``GET /api/v1/admin/users``.
      properties:
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        total_count:
          title: Total Count
          type: integer
        users:
          items:
            $ref: '#/components/schemas/AdminUserRow'
          title: Users
          type: array
      required:
      - users
      - total_count
      - limit
      - offset
      title: AdminUserListResponse
      type: object
    AdminUserRow:
      description: One row in the admin user list (Wave B v2 — PRD §5.2).
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        deletion_scheduled_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Deletion Scheduled At
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        email:
          title: Email
          type: string
        id:
          format: uuid
          title: Id
          type: string
        is_admin:
          title: Is Admin
          type: boolean
        last_login_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Login At
        mfa_enabled:
          title: Mfa Enabled
          type: boolean
        must_change_password:
          title: Must Change Password
          type: boolean
        role:
          title: Role
          type: string
      required:
      - id
      - email
      - display_name
      - role
      - is_admin
      - mfa_enabled
      - must_change_password
      - created_at
      - last_login_at
      - deletion_scheduled_at
      title: AdminUserRow
      type: object
    AliasCreateRequest:
      description: Request body for ``POST /api/v1/admin/aliases``.
      properties:
        fallback:
          anyOf:
          - items:
              $ref: '#/components/schemas/_FallbackEntry'
            type: array
          - type: 'null'
          title: Fallback
        model:
          minLength: 1
          title: Model
          type: string
        name:
          maxLength: 64
          minLength: 1
          title: Name
          type: string
        provider:
          minLength: 1
          title: Provider
          type: string
      required:
      - name
      - provider
      - model
      title: AliasCreateRequest
      type: object
    AliasUpdateRequest:
      description: Request body for ``PATCH /api/v1/admin/aliases/{name}``.
      properties:
        fallback:
          anyOf:
          - items:
              $ref: '#/components/schemas/_FallbackEntry'
            type: array
          - type: 'null'
          title: Fallback
        model:
          minLength: 1
          title: Model
          type: string
        provider:
          minLength: 1
          title: Provider
          type: string
      required:
      - provider
      - model
      title: AliasUpdateRequest
      type: object
    AttachKnowledgeBaseRequest:
      description: '``POST /api/v1/projects/{id}/knowledge-bases`` body.'
      properties:
        knowledge_base_id:
          format: uuid
          title: Knowledge Base Id
          type: string
      required:
      - knowledge_base_id
      title: AttachKnowledgeBaseRequest
      type: object
    AttachSkillRequest:
      description: '``POST /api/v1/projects/{id}/skills`` body.'
      properties:
        skill_name:
          maxLength: 200
          minLength: 1
          title: Skill Name
          type: string
      required:
      - skill_name
      title: AttachSkillRequest
      type: object
    AuditLogEntry:
      description: Wire shape for one audit_log row in the read endpoint response.
      properties:
        action:
          title: Action
          type: string
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
        id:
          title: Id
          type: string
        ip_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip Address
        privilege_basis:
          anyOf:
          - type: string
          - type: 'null'
          title: Privilege Basis
        privilege_marked:
          title: Privilege Marked
          type: boolean
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
        resource_type:
          title: Resource Type
          type: string
        routed_inference_tier:
          anyOf:
          - type: integer
          - type: 'null'
          title: Routed Inference Tier
        routed_provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Routed Provider
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        user_agent:
          anyOf:
          - type: string
          - type: 'null'
          title: User Agent
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
      required:
      - id
      - timestamp
      - user_id
      - action
      - resource_type
      - resource_id
      - privilege_marked
      - privilege_basis
      - routed_inference_tier
      - routed_provider
      - ip_address
      - user_agent
      - request_id
      - details
      title: AuditLogEntry
      type: object
    AuditLogPage:
      description: Paginated response for ``GET /api/v1/admin/audit-log``.
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditLogEntry'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - items
      title: AuditLogPage
      type: object
    AutonomousArtifactListResponse:
      description: 'Paginated list of :class:`AutonomousArtifactRead` items.


        Mirrors ``AutonomousFindingListResponse`` — total_count / limit /

        offset envelope. Artifacts are read in the same stable ``created_at

        ASC, id ASC`` order (see that schema''s note) — repeatable, not a

        guaranteed emission sequence; not a newest-first feed.'
      properties:
        artifacts:
          items:
            $ref: '#/components/schemas/AutonomousArtifactRead'
          title: Artifacts
          type: array
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        total_count:
          title: Total Count
          type: integer
      required:
      - artifacts
      - total_count
      - limit
      - offset
      title: AutonomousArtifactListResponse
      type: object
    AutonomousArtifactRead:
      description: 'ORM-read view of an ``autonomous_artifacts`` row (work-product
        ref).


        An artifact is a document-grade deliverable (a markdown memo) an

        opted-in run persisted into its target KB via the ``emit_artifact``

        chokepoint. ``name`` and ``mime`` are LLM-emitted free text (no

        CHECK constraints; the ``severity`` precedent). ``file_id`` is NULL

        if the underlying file was later hard-deleted — the name/size

        metadata survives here. ``document_id`` is NOT an ORM column: it is

        enriched at the endpoint from ``documents.file_id`` (default None),

        so the UI can deep-link the KB document. ``session_id`` is

        deliberately omitted — the endpoint is session-scoped per the Donna

        contract shape, so the caller already has it.'
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        document_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Document Id
        file_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: File Id
        id:
          format: uuid
          title: Id
          type: string
        mime:
          title: Mime
          type: string
        name:
          title: Name
          type: string
        size_bytes:
          title: Size Bytes
          type: integer
      required:
      - id
      - name
      - mime
      - size_bytes
      - created_at
      title: AutonomousArtifactRead
      type: object
    AutonomousFindingListResponse:
      description: 'Paginated list of :class:`AutonomousFindingRead` items.


        Mirrors ``AutonomousMemoryListResponse`` — total_count / limit /

        offset envelope. Findings are read in a stable ``created_at ASC, id

        ASC`` order — one run''s rows typically share ``created_at``

        (transaction-stable ``now()``), so ``id`` is the pagination

        tiebreaker; repeatable, not a guaranteed emission sequence. Not a

        newest-first feed. Uses the ``findings`` key (Donna''s UI expects

        ``findings: [...]``).'
      properties:
        findings:
          items:
            $ref: '#/components/schemas/AutonomousFindingRead'
          title: Findings
          type: array
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        total_count:
          title: Total Count
          type: integer
      required:
      - findings
      - total_count
      - limit
      - offset
      title: AutonomousFindingListResponse
      type: object
    AutonomousFindingRead:
      description: 'ORM-read view of an ``autonomous_findings`` row (work-product).


        A finding is one analysis result emitted by an autonomous run via the

        ``emit_finding`` chokepoint. ``content`` is the finding body — the

        LLM''s ``summary`` for the finding. ``severity`` is LLM-emitted free

        text (no CHECK constraint; ``info`` | ``warn`` | ``critical`` are the

        intended values but anything stores).'
      properties:
        content:
          title: Content
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        session_id:
          format: uuid
          title: Session Id
          type: string
        severity:
          title: Severity
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - session_id
      - severity
      - title
      - content
      - created_at
      title: AutonomousFindingRead
      type: object
    AutonomousManualRunRequest:
      description: 'Request body for ``POST /autonomous/run-now`` (Phase 1, §4.4).


        Spawns a single one-off autonomous session (``trigger_kind=''manual''``)

        so a user can test what a skill/playbook does — and inspect the

        resulting receipt — before arming it as a schedule or watch. Exactly

        one of ``playbook_id`` / ``skill_ref`` must be set (the agent runs an

        existing artifact; custom-task authoring is out of scope for Phase 1).

        ``target_kb_id`` and ``project_id`` are optional scope. ``max_cost_usd``

        is the per-run cap (NULL = fall back to

        ``settings.autonomous_default_max_cost_usd`` at spawn time, so R4 always

        trips). ``emit_artifacts`` opts the run in to document-grade artifacts

        (Donna ask #8) — a manual run has no schedule/watch row to inherit the

        flag from, so the request body IS the opt-in source; defaults off,

        matching the schedule/watch column default.'
      properties:
        emit_artifacts:
          default: false
          title: Emit Artifacts
          type: boolean
        max_cost_usd:
          anyOf:
          - type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Max Cost Usd
        playbook_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Playbook Id
        project_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Project Id
        skill_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Skill Ref
        target_kb_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Target Kb Id
      title: AutonomousManualRunRequest
      type: object
    AutonomousMemoryListResponse:
      description: 'Paginated list of :class:`AutonomousMemoryRead` items (M4-B1).


        Mirrors ``AutonomousSessionListResponse`` — total_count / limit /

        offset envelope for consistent pagination conventions across the API.

        Excludes soft-deleted entries (``deleted_at IS NULL``).'
      properties:
        entries:
          items:
            $ref: '#/components/schemas/AutonomousMemoryRead'
          title: Entries
          type: array
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        total_count:
          title: Total Count
          type: integer
      required:
      - entries
      - total_count
      - limit
      - offset
      title: AutonomousMemoryListResponse
      type: object
    AutonomousMemoryRead:
      description: ORM-read view of an :class:`~app.models.autonomous.AutonomousMemory`.
      properties:
        category:
          title: Category
          type: string
        content:
          title: Content
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        deleted_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Deleted At
        id:
          format: uuid
          title: Id
          type: string
        kept_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Kept At
        source_session_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Source Session Id
        state:
          $ref: '#/components/schemas/MemoryState'
        updated_at:
          format: date-time
          title: Updated At
          type: string
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - id
      - user_id
      - state
      - category
      - content
      - created_at
      - updated_at
      title: AutonomousMemoryRead
      type: object
    AutonomousNotificationListResponse:
      description: 'Paginated list of :class:`AutonomousNotificationRead` items (M4-C1).


        Mirrors ``AutonomousMemoryListResponse`` — total_count / limit /

        offset envelope. ``read_at IS NULL`` = unread; the ``?unread=true``

        filter on ``GET /autonomous/notifications`` narrows to unread rows.'
      properties:
        limit:
          title: Limit
          type: integer
        notifications:
          items:
            $ref: '#/components/schemas/AutonomousNotificationRead'
          title: Notifications
          type: array
        offset:
          title: Offset
          type: integer
        total_count:
          title: Total Count
          type: integer
      required:
      - notifications
      - total_count
      - limit
      - offset
      title: AutonomousNotificationListResponse
      type: object
    AutonomousNotificationRead:
      description: 'ORM-read view of an :class:`~app.models.autonomous.AutonomousNotification`.


        Written by the ``notify`` chokepoint handler (A3.3). ``read_at`` IS

        NULL = unread. The read/dismiss API that marks this column, plus email

        transport and webhook dispatch, land in M4-C1.'
      properties:
        body:
          title: Body
          type: string
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        payload:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Payload
        read_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Read At
        session_id:
          format: uuid
          title: Session Id
          type: string
        title:
          title: Title
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - id
      - user_id
      - session_id
      - channel
      - title
      - body
      - created_at
      - updated_at
      title: AutonomousNotificationRead
      type: object
    AutonomousScheduleCreate:
      description: 'Request body for ``POST /autonomous/schedules`` (M4-B3).


        ``cron_expr`` is required and validated by

        :func:`app.autonomous.cron.validate_cron_expr` (invalid → 422). The

        target (``playbook_id`` / ``skill_ref`` / ``target_kb_id``) and

        ``project_id`` are optional; ``enabled`` defaults to True.

        ``emit_artifacts`` opts the schedule''s sessions in to document-grade

        artifact emission (default off — zero behavior/cost change unless

        requested). ``max_cost_usd`` is the per-schedule spend cap (NULL =

        fall back to ``settings.autonomous_default_max_cost_usd`` at spawn

        time).'
      properties:
        cron_expr:
          title: Cron Expr
          type: string
        emit_artifacts:
          default: false
          title: Emit Artifacts
          type: boolean
        enabled:
          default: true
          title: Enabled
          type: boolean
        max_cost_usd:
          anyOf:
          - type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Max Cost Usd
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        playbook_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Playbook Id
        project_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Project Id
        skill_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Skill Ref
        target_kb_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Target Kb Id
      required:
      - cron_expr
      title: AutonomousScheduleCreate
      type: object
    AutonomousScheduleListResponse:
      description: 'Paginated list of :class:`AutonomousScheduleRead` items (M4-B3).


        Mirrors ``AutonomousMemoryListResponse`` — total_count / limit /

        offset envelope. Excludes soft-deleted schedules (``deleted_at IS

        NULL``).'
      properties:
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        schedules:
          items:
            $ref: '#/components/schemas/AutonomousScheduleRead'
          title: Schedules
          type: array
        total_count:
          title: Total Count
          type: integer
      required:
      - schedules
      - total_count
      - limit
      - offset
      title: AutonomousScheduleListResponse
      type: object
    AutonomousScheduleRead:
      description: ORM-read view of an :class:`~app.models.autonomous.AutonomousSchedule`.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        cron_expr:
          title: Cron Expr
          type: string
        deleted_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Deleted At
        emit_artifacts:
          title: Emit Artifacts
          type: boolean
        enabled:
          title: Enabled
          type: boolean
        id:
          format: uuid
          title: Id
          type: string
        last_run_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Run At
        max_cost_usd:
          anyOf:
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Max Cost Usd
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        next_run_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Next Run At
        playbook_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Playbook Id
        project_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Project Id
        skill_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Skill Ref
        target_kb_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Target Kb Id
        updated_at:
          format: date-time
          title: Updated At
          type: string
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - id
      - user_id
      - cron_expr
      - enabled
      - emit_artifacts
      - created_at
      - updated_at
      title: AutonomousScheduleRead
      type: object
    AutonomousScheduleUpdate:
      description: 'Request body for ``PATCH /autonomous/schedules/{id}`` (M4-B3).


        All fields optional — a partial update. If ``cron_expr`` is provided

        it is re-validated (invalid → 422) and ``next_run_at`` is recomputed.

        Toggling ``enabled`` is allowed. ``emit_artifacts`` may be toggled

        to opt the schedule''s future sessions in or out of document-grade

        artifact emission. ``max_cost_usd`` may be edited

        (NULL clears the per-schedule cap → fall back to global default).

        The matter (``project_id``) may be reassigned; an explicit ``null``

        clears it (unassign). A non-null ``project_id`` the caller does not

        own is rejected (404, id-probing-safe).'
      properties:
        cron_expr:
          anyOf:
          - type: string
          - type: 'null'
          title: Cron Expr
        emit_artifacts:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Emit Artifacts
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
        max_cost_usd:
          anyOf:
          - type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Max Cost Usd
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        playbook_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Playbook Id
        project_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Project Id
        skill_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Skill Ref
        target_kb_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Target Kb Id
      title: AutonomousScheduleUpdate
      type: object
    AutonomousSessionDetailResponse:
      description: 'Session detail view including the live-reconstructed receipt.


        ``receipt`` is built by :func:`~app.autonomous.receipt.build_receipt`

        on every request — it works for running and completed sessions alike.

        A completed session also has the receipt persisted in ``result``.'
      properties:
        receipt:
          additionalProperties: true
          title: Receipt
          type: object
        session:
          $ref: '#/components/schemas/AutonomousSessionRead'
      required:
      - session
      - receipt
      title: AutonomousSessionDetailResponse
      type: object
    AutonomousSessionListResponse:
      description: 'Paginated list of :class:`AutonomousSessionRead` items.


        Mirrors ``AdminUserListResponse`` (total_count / limit / offset

        envelope) for consistent pagination conventions across the API.'
      properties:
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        sessions:
          items:
            $ref: '#/components/schemas/AutonomousSessionRead'
          title: Sessions
          type: array
        total_count:
          title: Total Count
          type: integer
      required:
      - sessions
      - total_count
      - limit
      - offset
      title: AutonomousSessionListResponse
      type: object
    AutonomousSessionRead:
      description: ORM-read view of an :class:`~app.models.autonomous.AutonomousSession`.
      properties:
        completed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Completed At
        cost_cap_reached:
          title: Cost Cap Reached
          type: boolean
        cost_total_usd:
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Cost Total Usd
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        current_phase:
          $ref: '#/components/schemas/Phase'
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        halt_state:
          $ref: '#/components/schemas/HaltState'
        id:
          format: uuid
          title: Id
          type: string
        idle_halt_minutes:
          title: Idle Halt Minutes
          type: integer
        last_activity_at:
          format: date-time
          title: Last Activity At
          type: string
        max_cost_usd:
          anyOf:
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Max Cost Usd
        params:
          additionalProperties: true
          default: {}
          title: Params
          type: object
        project_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Project Id
        result:
