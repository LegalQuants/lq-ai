[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
markers = [
    "unit: pure unit tests, no I/O",
    "integration: tests that exercise contracts across subsystems",
    "live: tests that need a running stack + provider key (opt-in via env guards)",
    "golden_live: skill golden tests that need a live compose stack with a configured gateway (skipped unless LQ_GOLDEN_LIVE=1; see tests/golden/README.md)",
    "injection_live: prompt-injection observation tests that need a live compose stack with a configured gateway (skipped unless LQ_INJECTION_LIVE=1; see docs/quality/prompt-injection-rates.md)",
]
